def _build_error_report(exc: Exception, user_py_code: str, fname: str = "<custom_user_code>") -> dict:
    """Extracts line numbers, caret excerpts, kernel context, and clean tracebacks from any exception."""
    src_lines = user_py_code.splitlines()
    lineno = getattr(exc, "lineno", None)
    col_offset = getattr(exc, "col_offset", getattr(exc, "offset", None))
    kernel_name = getattr(exc, "kernel_name", None)
    err_type = type(exc).__name__
    msg = getattr(exc, "message", getattr(exc, "msg", str(exc)))

    tb_list = traceback.extract_tb(exc.__traceback__)
    if lineno is None:
        for frame in reversed(tb_list):
            if frame.filename == fname:
                lineno = frame.lineno
                break

    excerpt = ""
    if lineno is not None and 1 <= lineno <= len(src_lines):
        start_l = max(1, lineno - 1)
        end_l = min(len(src_lines), lineno + 1)
        snippet_rows = []
        for l_idx in range(start_l, end_l + 1):
            prefix = ">> " if l_idx == lineno else "   "
            snippet_rows.append(f"{prefix}{l_idx:3d} | {src_lines[l_idx - 1]}")
            if l_idx == lineno and col_offset is not None and col_offset >= 0:
                caret_pad = " " * (9 + max(0, int(col_offset)))
                snippet_rows.append(f"{caret_pad}^")
        excerpt = "\n".join(snippet_rows)

    filtered_tb = []
    for frame in tb_list:
        if frame.filename in (fname, "<app_init>"):
            loc_tag = "User Code" if frame.filename == fname else "PyWASM Compiler"
            filtered_tb.append(f"  [{loc_tag}] line {frame.lineno}, in {frame.name}\n    {frame.line or ''}")

    log_compiler_event(
        "ERROR",
        "DIAGNOSTIC",
        f"{err_type} at L{lineno or '?'}: {msg}",
        line=lineno,
    )

    return {
        "error_type": err_type,
        "message": msg,
        "lineno": lineno,
        "col_offset": col_offset,
        "kernel_name": kernel_name,
        "excerpt": excerpt,
        "traceback": "\n".join(filtered_tb) if filtered_tb else traceback.format_exc(),
    }


def _snapshot_module_and_runtime(mod: WasmModule | None, runtime: dict | None, arenas: dict[str, SoAArena]):
    TYPE_NAMES = {I32: "i32", F32: "f32", V128: "v128", None: "void"}
    fn_disasm = []
    arrays_info = []
    struct_outs_info = []
    line_byte_counts: dict[int, dict] = {}
    wasm_bytes = b""
    section_sizes = {}

    if mod is not None:
        if runtime is not None and "wasm_bytes" in runtime:
            wasm_bytes = runtime["wasm_bytes"]
        else:
            wasm_bytes = mod.to_bytes()
        section_sizes = dict(mod.section_sizes)

        for fn in mod.functions:
            insts = disassemble_code(bytes(fn.code), fn.line_spans)
            for ins in insts:
                ln = ins.get("py_line")
                if ln is not None:
                    entry = line_byte_counts.setdefault(ln, {"bytes": 0, "ops": 0, "simd": 0})
                    entry["bytes"] += ins.get("byte_len", 1)
                    entry["ops"] += 1
                    if ins.get("is_simd"):
                        entry["simd"] += 1

            fn_disasm.append({
                "name": fn.name,
                "ret": TYPE_NAMES.get(fn.ret_type, "void"),
                "params": [TYPE_NAMES.get(p, "i32") for p in fn.params],
                "param_names": list(fn.param_names),
                "locals": [TYPE_NAMES.get(l, "i32") for l in fn.locals],
                "instructions": insts,
                "sympy_rewrites": list(fn.sympy_rewrites),
                "beniget_report": dict(fn.beniget_report),
            })

        for name, arr in mod.arrays.items():
            preview = []
            np_stats = None
            if runtime and name in runtime:
                w_arr = runtime[name]
                limit = min(12, arr.capacity)
                preview = [round(float(w_arr[i]), 4) if arr.dtype == "f32" else int(w_arr[i]) for i in range(limit)]
                if HAS_NUMPY:
                    sample_len = min(256, arr.capacity)
                    np_a = np.array([float(w_arr[i]) for i in range(sample_len)], dtype=np.float32)
                    np_stats = {
                        "min": round(float(np.min(np_a)), 4),
                        "max": round(float(np.max(np_a)), 4),
                        "mean": round(float(np.mean(np_a)), 4),
                    }
            arrays_info.append({
                "name": name,
                "dtype": arr.dtype,
                "capacity": arr.capacity,
                "byte_offset": arr.byte_offset,
                "byte_length": arr.byte_length,
                "preview": preview,
                "np_stats": np_stats,
            })

        for name, so in mod.struct_outs.items():
            try:
                struct_outs_info.append({
                    "name": name,
                    "fields": so.to_dict() if runtime else list(object.__getattribute__(so, "_fields").keys())
                })
            except Exception:
                pass

    arenas_info = []
    for a_name, arena in arenas.items():
        field_previews = {}
        for f_name, f_arr in arena.fields.items():
            limit = min(8, arena.cursor if arena.cursor > 0 else arena.capacity)
            field_previews[f_name] = [round(float(f_arr[i]), 4) if arena.schema[f_name] == "f32" else int(f_arr[i]) for i in range(limit)]
        arenas_info.append({
            "name": a_name,
            "capacity": arena.capacity,
            "cursor": arena.cursor,
            "reclaimable": arena.reclaimable,
            "schema": dict(arena.schema),
            "previews": field_previews,
            "numpy_backed": bool(HAS_NUMPY),
        })

    wasm_b64 = base64.b64encode(wasm_bytes).decode("ascii") if wasm_bytes else ""

    return {
        "wasm_b64": wasm_b64,
        "wasm_hex": [f"{b:02x}" for b in wasm_bytes],
        "wasm_size": len(wasm_bytes),
        "section_sizes": section_sizes,
        "functions": fn_disasm,
        "arrays": arrays_info,
        "struct_outs": struct_outs_info,
        "arenas": arenas_info,
        "line_byte_counts": line_byte_counts,
        "compiler_logs": list(_COMPILER_LOGS),
    }


def compile_playground_code(user_py_code: str) -> dict:
    global _ACTIVE_USER_MOD, _ACTIVE_USER_RUNTIME, _ACTIVE_USER_ARENAS
    _COMPILER_LOGS.clear()

    if not user_py_code or not user_py_code.strip():
        return {
            "ok": False,
            "elapsed_ms": 0.0,
            "stdout": "",
            "error_report": {
                "error_type": "ValueError",
                "message": "Python editor is empty. Enter Python code or select a built-in example.",
                "lineno": 1,
                "col_offset": 0,
                "kernel_name": None,
                "excerpt": "",
                "traceback": "",
            },
            "compiler_logs": list(_COMPILER_LOGS),
        }

    fname = "<custom_user_code>"
    lines = [line + "\n" for line in user_py_code.splitlines()]
    linecache.cache[fname] = (len(user_py_code), None, lines, fname)

    base_env = {
        "WasmModule": WasmModule,
        "FuncBuilder": FuncBuilder,
        "MemoryArray": MemoryArray,
        "StructOut": StructOut,
        "Expr": Expr,
        "i32": i32,
        "f32": f32,
        "byte_offset": byte_offset,
        "select": select,
        "murmur_hash32": murmur_hash32,
        "I32": I32,
        "F32": F32,
        "V128": V128,
        "compile_with_simd_fallback": compile_with_simd_fallback,
        "SoAArena": SoAArena,
        "np": np,
        "sympy": sympy,
    }
    ns = dict(base_env)

    stdout_buf = io.StringIO()
    old_stdout, old_stderr = sys.stdout, sys.stderr
    sys.stdout = stdout_buf
    sys.stderr = stdout_buf

    mod: WasmModule | None = None
    runtime: dict | None = None
    summary: dict = {}

    t0 = time.perf_counter()
    try:
        code_obj = compile(user_py_code, fname, "exec")
        exec(code_obj, ns)

        if "run_demo" in ns and callable(ns["run_demo"]):
            demo_res = ns["run_demo"]()
            if isinstance(demo_res, tuple):
                if len(demo_res) == 3:
                    mod, runtime, summary = demo_res
                elif len(demo_res) == 2:
                    mod, runtime = demo_res
            elif isinstance(demo_res, WasmModule):
                mod = demo_res
            elif isinstance(demo_res, dict):
                if "wasm_bytes" in demo_res:
                    runtime = demo_res
                    mod = runtime.get("module_obj")
                else:
                    summary = demo_res

        arenas: dict[str, SoAArena] = {}
        for k, v in ns.items():
            if k in base_env or k.startswith("_"):
                continue
            if isinstance(v, WasmModule):
                mod = v
            elif isinstance(v, dict) and "wasm_bytes" in v and "exports" in v:
                runtime = v
                if mod is None and isinstance(v.get("module_obj"), WasmModule):
                    mod = v["module_obj"]
            elif isinstance(v, SoAArena):
                arenas[k] = v
            elif isinstance(v, (int, float, str, bool, list, tuple, dict)) and k != "run_demo":
                if not isinstance(summary, dict):
                    summary = {"result": str(summary)}
                if k not in summary:
                    try:
                        summary[k] = v if isinstance(v, (int, float, str, bool)) else repr(v)[:200]
                    except Exception:
                        pass

        if mod is not None and runtime is None:
            if mod._last_runtime is not None:
                runtime = mod._last_runtime
            elif len(mod.functions) > 0:
                runtime = mod.instantiate()

    except Exception as exc:
        elapsed_ms = (time.perf_counter() - t0) * 1000.0
        err_report = _build_error_report(exc, user_py_code, fname)
        return {
            "ok": False,
            "elapsed_ms": round(elapsed_ms, 2),
            "stdout": stdout_buf.getvalue(),
            "error_report": err_report,
            "compiler_logs": list(_COMPILER_LOGS),
        }
    finally:
        sys.stdout = old_stdout
        sys.stderr = old_stderr

    elapsed_ms = (time.perf_counter() - t0) * 1000.0
    _ACTIVE_USER_MOD = mod
    _ACTIVE_USER_RUNTIME = runtime
    _ACTIVE_USER_ARENAS = arenas

    log_compiler_event("PASS", "EXEC", f"Script executed in {elapsed_ms:.2f} ms.")
    snap = _snapshot_module_and_runtime(mod, runtime, arenas)
    return {
        "ok": True,
        "elapsed_ms": round(elapsed_ms, 2),
        "stdout": stdout_buf.getvalue(),
        "summary": summary if isinstance(summary, dict) else {"Result": str(summary)},
        "error_report": None,
        **snap,
    }


def apply_optimized_wasm_b64(opt_b64: str) -> dict:
    """Hot-swaps the active runtime with Binaryen-optimized WebAssembly bytes."""
    global _ACTIVE_USER_RUNTIME
    if _ACTIVE_USER_MOD is None:
        raise RuntimeError("No active WasmModule to swap.")
    opt_bytes = base64.b64decode(opt_b64)
    old_rt = _ACTIVE_USER_RUNTIME
    new_rt = _ACTIVE_USER_MOD.instantiate(custom_wasm_bytes=opt_bytes)
    if old_rt is not None and HAS_JS:
        for name in _ACTIVE_USER_MOD.arrays:
            if name in old_rt and name in new_rt:
                new_rt[name].set(old_rt[name])
    _ACTIVE_USER_RUNTIME = new_rt
    log_compiler_event("OPT", "BINARYEN", f"Hot-swapped active WebAssembly instance with Binaryen -O3 binary ({len(opt_bytes)}B).")
    return _snapshot_module_and_runtime(_ACTIVE_USER_MOD, _ACTIVE_USER_RUNTIME, _ACTIVE_USER_ARENAS)


def invoke_active_wasm_function(fn_name: str, args: list) -> dict:
    if _ACTIVE_USER_MOD is None or _ACTIVE_USER_RUNTIME is None:
        raise RuntimeError("No instantiated WasmModule is currently active.")
    if fn_name not in _ACTIVE_USER_RUNTIME:
        raise ValueError(f"Exported function '{fn_name}' not found in active runtime.")

    fn_builder = next((f for f in _ACTIVE_USER_MOD.functions if f.name == fn_name), None)
    typed_args = []
    for idx, val in enumerate(args):
        if fn_builder and idx < len(fn_builder.params):
            ptype = fn_builder.params[idx]
            typed_args.append(float(val) if ptype == F32 else int(float(val)))
        else:
            typed_args.append(float(val) if "." in str(val) else int(val))

    t0 = time.perf_counter()
    ret_val = _ACTIVE_USER_RUNTIME[fn_name](*typed_args)
    dt_us = (time.perf_counter() - t0) * 1_000_000.0

    if fn_builder and fn_builder.ret_type == F32 and ret_val is not None:
        ret_val = round(float(ret_val), 6)
    elif ret_val is not None:
        ret_val = int(ret_val)

    log_compiler_event("INFO", "EXEC", f"Called {fn_name}({', '.join(map(str, typed_args))}) -> {ret_val} ({dt_us:.2f} µs)")
    snap = _snapshot_module_and_runtime(_ACTIVE_USER_MOD, _ACTIVE_USER_RUNTIME, _ACTIVE_USER_ARENAS)
    return {
        "fn_name": fn_name,
        "args": typed_args,
        "return_value": ret_val,
        "latency_us": round(dt_us, 2),
        **snap,
    }


def run_hypothesis_fuzz(fn_name: str, max_examples: int = 25) -> dict:
    """Property-based fuzz testing of a compiled WASM kernel via `hypothesis`."""
    if not HAS_HYPOTHESIS:
        raise RuntimeError("Hypothesis package is not available.")
    if _ACTIVE_USER_MOD is None or _ACTIVE_USER_RUNTIME is None:
        raise RuntimeError("No active WASM runtime.")
    fn_builder = next((f for f in _ACTIVE_USER_MOD.functions if f.name == fn_name), None)
    if fn_builder is None:
        raise ValueError(f"Function {fn_name} not found.")

    min_cap = min((arr.capacity for arr in _ACTIVE_USER_MOD.arrays.values()), default=64)
    safe_n = max(1, min(64, min_cap))

    strat_list = []
    for p_name, p_type in zip(fn_builder.param_names, fn_builder.params):
        if p_type == I32:
            if p_name in ("n", "width", "samples", "count"):
                strat_list.append(st.integers(min_value=1, max_value=safe_n))
            elif "iter" in p_name:
                strat_list.append(st.integers(min_value=1, max_value=32))
            else:
                strat_list.append(st.integers(min_value=-10000, max_value=10000))
        else:
            strat_list.append(st.floats(min_value=-100.0, max_value=100.0, width=32, allow_nan=False, allow_infinity=False))

    args_strategy = st.tuples(*strat_list)
    tested_samples = []
    wasm_fn = _ACTIVE_USER_RUNTIME[fn_name]

    t0 = time.perf_counter()

    @settings(
        max_examples=max_examples,
        database=None,
        deadline=None,
        suppress_health_check=list(HealthCheck),
    )
    @given(args_strategy)
    def _prop_check(arg_tuple):
        r1 = wasm_fn(*arg_tuple)
        r2 = wasm_fn(*arg_tuple)
        if fn_builder.ret_type == F32:
            assert math.isfinite(float(r1)) or math.isnan(float(r1))
            if not math.isnan(float(r1)):
                assert math.isclose(float(r1), float(r2), rel_tol=1e-5, abs_tol=1e-6)
        elif fn_builder.ret_type == I32:
            assert int(r1) == int(r2)
        if len(tested_samples) < 6:
            tested_samples.append({
                "args": [round(float(x), 4) if isinstance(x, float) else int(x) for x in arg_tuple],
                "ret": round(float(r1), 5) if fn_builder.ret_type == F32 else int(r1),
            })

    _prop_check()
    elapsed_ms = (time.perf_counter() - t0) * 1000.0
    log_compiler_event("PASS", "FUZZ", f"Hypothesis verified '{fn_name}' across {max_examples} generated test cases ({elapsed_ms:.1f} ms).")
    snap = _snapshot_module_and_runtime(_ACTIVE_USER_MOD, _ACTIVE_USER_RUNTIME, _ACTIVE_USER_ARENAS)

    return {
        "fn_name": fn_name,
        "examples_run": max_examples,
        "status": "PASSED (Deterministic & Non-Trapping)",
        "elapsed_ms": round(elapsed_ms, 2),
        "samples": tested_samples,
        **snap,
    }


def inspect_single_expr(expr_str: str) -> dict:
    if not expr_str or not expr_str.strip():
        raise ValueError("Enter a Python WASM `Expr` expression.")
    mod = WasmModule()
    fn = mod.function("test")
    a = fn.param("a", "f32")
    b = fn.param("b", "f32")
    i = fn.param("i", "i32")
    j = fn.param("j", "i32")
    v1 = fn.local("v1", "v128")
    v2 = fn.local("v2", "v128")
    arr = mod.array("arr", "f32", 64)

    env = {
        "a": a, "b": b, "i": i, "j": j, "v1": v1, "v2": v2, "arr": arr,
        "i32": i32, "f32": f32, "byte_offset": byte_offset,
        "select": select, "murmur_hash32": murmur_hash32,
    }
    res = eval(expr_str, {"__builtins__": {}}, env)
    if not isinstance(res, Expr):
        raise ValueError("Expression did not evaluate to a WASM `Expr` instance.")

    sympy_info = None
    if HAS_SYMPY:
        try:
            sa, sb, si, sj = sympy.symbols("a b i j", real=True)
            sym_val = eval(expr_str, {"__builtins__": {}}, {"a": sa, "b": sb, "i": si, "j": sj})
            if isinstance(sym_val, sympy.Basic):
                repls, reduced = sympy.cse([sym_val])
                sympy_info = {
                    "simplified": str(sympy.simplify(sym_val)),
                    "horner": str(sympy.horner(sym_val)) if sym_val.is_polynomial() else str(sym_val),
                    "cse_temps": [f"{lhs} = {rhs}" for lhs, rhs in repls],
                    "cse_result": str(reduced[0]),
                }
        except Exception:
            sympy_info = None

    t_map = {I32: "i32 (0x7F)", F32: "f32 (0x7D)", V128: "v128 (0x7B)"}
    return {
        "vtype": t_map.get(res.vtype, hex(res.vtype)),
        "is_byte_offset": bool(res.is_byte_offset),
        "hex": res.code.hex(" "),
        "b64": base64.b64encode(res.code).decode("ascii"),
        "byte_len": len(res.code),
        "instructions": disassemble_code(res.code),
        "sympy_info": sympy_info,
    }


def encode_leb_demo(val: int) -> dict:
    u_bytes = leb128_u(max(0, val))
    s_bytes = leb128_s(val)
    return {
        "u_hex": u_bytes.hex(" "),
        "u_b64": base64.b64encode(u_bytes).decode("ascii"),
        "s_hex": s_bytes.hex(" "),
        "s_b64": base64.b64encode(s_bytes).decode("ascii"),
    }

def build_vector_module(use_simd=True):
    mod = WasmModule(align_bytes=16)
    N = 1024

    X = mod.array("X", "f32", N)
    Y = mod.array("Y", "f32", N)
    Z = mod.array("Z", "f32", N)
    stats = mod.struct_out("stats", ["first", "last", "max_val", "sum_total"], dtype="f32")

    @mod.kernel(ret="i32", n="i32", alpha="f32")
    def saxpy_simd(n, alpha):
        i: i32 = 0
        if use_simd:
            v_alpha = splat(alpha)
            n_vec: i32 = n & ~3
            while i < n_vec:
                off = byte_offset(i)
                Z.v128[off] = (X.v128[off] * v_alpha) + Y.v128[off]
                i += 4

        while i < n:
            Z[i] = X[i] * alpha + Y[i]
            i += 1

        # Compute summary stats + polynomial gain (SymPy Horner factors alpha*alpha + 2.0*alpha + 1.0)
        poly_gain: f32 = alpha * alpha + 2.0 * alpha + 1.0
        total: f32 = 0.0
        max_v: f32 = -999999.0
        for k in range(0, n):
            val: f32 = Z[k]
            total += val
            max_v = val if val > max_v else max_v

        stats.first = Z[0] * poly_gain
        stats.last = Z[n - 1]
        stats.max_val = max_v
        stats.sum_total = total
        return n

    return mod
# endregion

@mod.kernel(ret="i32", n="i32", qx="f32", qy="f32", radius="f32")
def query_particles(n, qx, qy, radius):
    r2: f32 = radius * radius
    hits: i32 = 0
    min_d2: f32 = 99999999.0
    sum_x: f32 = 0.0
    sum_y: f32 = 0.0

    for i in range(0, n):
        off = byte_offset(i)
        dx: f32 = px[off] - qx
        dy: f32 = py[off] - qy
        d2: f32 = dx * dx + dy * dy

            hits += 1
            sum_x += px[off]
            sum_y += py[off]
        else:

    out.closest_dist = sqrt(min_d2)
    out.centroid_x = (sum_x / hits.to_f32()) if hits > 0 else qx
    out.centroid_y = (sum_y / hits.to_f32()) if hits > 0 else qy

mod = WasmModule(align_bytes=16)

escape_counts = mod.array("escape_counts", "i32", 128)
mc_out = mod.struct_out("mc_out", ["inside_circle", "pi_estimate"], dtype="f32")

@mod.kernel(ret="f32", samples="i32", seed="i32")
def estimate_pi(samples, seed):
    inside: i32 = 0
    for i in range(0, samples):
        h: i32 = murmur_hash32(seed, i)
        rx: f32 = (h & 65535).to_f32() / 65535.0
        ry: f32 = (shr_u(h, 16) & 65535).to_f32() / 65535.0
        if (rx * rx + ry * ry) <= 1.0:
            inside += 1

    pi_est: f32 = (4.0 * inside.to_f32()) / samples.to_f32()
    mc_out.inside_circle = inside.to_f32()
    mc_out.pi_estimate = pi_est
    return pi_est

@mod.kernel(ret="i32", width="i32", cy="f32", max_iter="i32")
def mandelbrot_row(width, cy, max_iter):
    total_iters: i32 = 0
    for x in range(0, width):
        cx: f32 = -2.0 + (x.to_f32() / width.to_f32()) * 3.0
        zx: f32 = cx
        zy: f32 = cy
        it: i32 = 0

        while it < max_iter:
            zx2: f32 = zx * zx
            zy2: f32 = zy * zy
            if (zx2 + zy2) > 4.0:
                break
            zy = 2.0 * zx * zy + cy
            zx = zx2 - zy2 + cx
            it += 1

        escape_counts[x] = it
        total_iters += it
    return total_iters
# endregion

# region 2 kernel_invocation_and_readback

pi_val = runtime["estimate_pi"](50000, 1337)
total_mandel_iters = runtime["mandelbrot_row"](64, 0.0, 100)

print(f"Mandelbrot Row Total Iterations: {total_mandel_iters}")

    // # region 11 comlink_web_worker_and_codemirror_helpers
    function createComlinkWasmWorker() {
      const workerCode = `
        import * as Comlink from 'https://esm.sh/comlink@4.4.2';

        const workerApi = {
          async executeWasmExport(wasmB64, fnName, args, iterations = 1) {
            const binStr = atob(wasmB64);
            const bytes = new Uint8Array(binStr.length);
            for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

            const mod = new WebAssembly.Module(bytes);
            const inst = new WebAssembly.Instance(mod);
            const fn = inst.exports[fnName];
            if (typeof fn !== 'function') {
              throw new Error("Export '" + fnName + "' not found in Worker WASM instance.");
            }
            const t0 = performance.now();
            let ret = null;
            const reps = Math.max(1, iterations | 0);
            for (let r = 0; r < reps; r++) {
              ret = fn(...args);
            }
            const dtUs = ((performance.now() - t0) * 1000.0) / reps;
            return {
              fn_name: fnName,
              args,
              iterations: reps,
              return_value: ret,
              avg_latency_us: Number(dtUs.toFixed(2)),
              thread: 'Comlink Web Worker'
            };
          }
        };

        Comlink.expose(workerApi);
      `;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const worker = new Worker(URL.createObjectURL(blob), { type: 'module' });
      return Comlink.wrap(worker);
    }

    // CodeMirror 6 widget showing emitted WASM byte/op counts or inline error per Python line
    class LineWasmBadgeWidget extends WidgetType {

        span.textContent = `→ ${this.info.ops} op (${this.info.bytes}B${simdTag})`;

    const setLineDiagnosticsEffect = StateEffect.define();
    const lineDiagnosticsField = StateField.define({
      create() {

      update(deco, tr) {

        for (const e of tr.effects) {
          if (e.is(setLineDiagnosticsEffect)) {
            const decos = [];
            const { lineCounts = {}, errorReport = null } = e.value || {};
            const doc = tr.state.doc;

            for (const [lineStr, info] of Object.entries(lineCounts)) {
              const lineNo = parseInt(lineStr, 10);
              if (lineNo >= 1 && lineNo <= doc.lines) {
                const lineObj = doc.line(lineNo);
                decos.push(
                  Decoration.widget({
                    widget: new LineWasmBadgeWidget(info),
                    side: 1
                  }).range(lineObj.to)
                );
              }
            }

            if (errorReport && errorReport.lineno) {
              const errLine = parseInt(errorReport.lineno, 10);
              if (errLine >= 1 && errLine <= doc.lines) {
                const lineObj = doc.line(errLine);
                decos.push(Decoration.line({ class: 'cm-error-line' }).range(lineObj.from));

                    widget: new LineErrorBadgeWidget(`${errorReport.error_type}: ${errorReport.message.slice(0, 65)}`),
                    side: 1
                  }).range(lineObj.to)
                );
              }
            }

            decos.sort((a, b) => a.from - b.from || a.startSide - b.startSide);
            deco = Decoration.set(decos, true);
          }

    function b64ToUint8Array(b64) {
      const binStr = atob(b64);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
      return bytes;
    }

    function uint8ArrayToB64(u8) {
      let s = '';
      for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
      return btoa(s);

          setFnArgsInput(initialArgs);
        } catch (err) {
          appendJsLog('ERROR', 'BRIDGE', err.message);
          setErrorReport({
            error_type: 'BridgeError',
            message: err.message,
            lineno: null,
            col_offset: null,
            kernel_name: null,
            excerpt: '',
            traceback: err.stack || ''
          });
        }
      };

      // SolidJS 2.0 onSettled lifecycle hook
      onSettled(() => {
        let mounted = true;
        async function init() {
          try {
            appendJsLog('INFO', 'INIT', 'Starting Comlink Web Worker, WABT, and Pyodide runtime...');
            const comlinkWorker = createComlinkWasmWorker();
            setWorkerProxy(() => comlinkWorker);

            const [py, wMod] = await Promise.all([
              loadPyodide(),
              wabt().catch(() => null)
            ]);
            if (!mounted) return;
            setWabtInstance(wMod);

            setStatus('Loading numpy, sympy & micropip packages...');
            await py.loadPackage(['numpy', 'sympy', 'micropip']);
            await py.runPythonAsync(`
import micropip
await micropip.install(['asttokens', 'gast', 'beniget', 'hypothesis'])
`);
            if (!mounted) return;
            appendJsLog('PASS', 'INIT', 'Loaded Python packages: numpy, sympy, asttokens, gast, beniget, hypothesis.');

            const libCode = document.getElementById('python-compiler-lib').textContent;
            const bridgeCode = document.getElementById('python-disassembler-bridge').textContent;
            const fullSource = libCode + '\n' + bridgeCode;

            py.globals.set('_FULL_APPLICATION_SOURCE', fullSource);
            await py.runPythonAsync(`
import linecache
_lines = [line + "\\n" for line in _FULL_APPLICATION_SOURCE.splitlines()]
linecache.cache["<app_init>"] = (len(_FULL_APPLICATION_SOURCE), None, _lines, "<app_init>")
exec(compile(_FULL_APPLICATION_SOURCE, "<app_init>", "exec"), globals())
`);
            runCodeWithPy(py, BUILTIN_PYTHON_EXAMPLES[0].code, wMod);

            const eRes = py.globals.get('inspect_single_expr')(BUILTIN_EXPR_EXAMPLES[0].expr).toJs({ dict_converter: Object.fromEntries });
            setExprResult(eRes);

            const lRes = py.globals.get('encode_leb_demo')(-12345).toJs({ dict_converter: Object.fromEntries });
            setLebResult(lRes);

            setPyodide(py);
            setStatus('Ready');
          } catch (err) {
            appendJsLog('ERROR', 'INIT', err.message);
            setStatus('Error: ' + err.message);
          }
        }
        init();
        return () => { mounted = false; };
      });

      const handleCompileUserCode = () => {
        const py = pyodide();
        if (!py) return;
        runCodeWithPy(py, userCode());
      };

      const handleApplyBinaryenOptimization = () => {
        const py = pyodide();
        const bStats = binaryenStats();
        if (!py || !bStats?.optB64) return;
        try {
          const snap = py.globals.get('apply_optimized_wasm_b64')(bStats.optB64).toJs({ dict_converter: Object.fromEntries });
          mergeCompilerLogs(snap.compiler_logs || []);
          setCompileResult(prev => prev ? ({
            ...prev,
            wasm_b64: snap.wasm_b64,
            wasm_size: snap.wasm_size,
            arrays: snap.arrays,
            struct_outs: snap.struct_outs,
            arenas: snap.arenas,
          }) : prev);
          setBinaryenStats({ ...bStats, applied: true });
          setDisasmMode('binaryen');
        } catch (err) {
          appendJsLog('ERROR', 'BINARYEN', err.message);
        }
      };

      const handleSelectExample = (e) => {
        const id = e.target.value;
        setSelectedExampleId(id);
        if (id === 'custom') {
          setUserCode('');
          setCompileResult(null);
          setErrorReport(null);
          setLastInvokeResult(null);
          setFuzzResult(null);
          return;
        }
        const found = BUILTIN_PYTHON_EXAMPLES.find(ex => ex.id === id);
        if (found) {
          setUserCode(found.code);
          const py = pyodide();
          if (py) runCodeWithPy(py, found.code);
        }
      };

      const handleInvokeFunction = (fnName) => {
        const py = pyodide();
        if (!py) return;
        try {
          setErrorReport(null);
          const rawArgs = (fnArgsInput() || {})[fnName] || [];
          const res = py.globals.get('invoke_active_wasm_function')(fnName, rawArgs).toJs({ dict_converter: Object.fromEntries });
          appendJsLog('INFO', 'EXEC', `Main Thread: ${res.fn_name}(${res.args.join(', ')}) = ${res.return_value} (${res.latency_us} µs)`);
          setLastInvokeResult({
            fn_name: res.fn_name,
            args: res.args,
            return_value: res.return_value,
            latency_us: res.latency_us,
            thread: 'Main Thread (Shared Memory)'
          });
          setCompileResult(prev => prev ? ({
            ...prev,
            wasm_b64: res.wasm_b64,
            arrays: res.arrays,
            struct_outs: res.struct_outs,
            arenas: res.arenas,
          }) : prev);
        } catch (err) {
          appendJsLog('ERROR', 'EXEC', err.message);
          setErrorReport({
            error_type: 'RuntimeInvokeError',
            message: err.message,
            lineno: null,
            col_offset: null,
            kernel_name: fnName,
            excerpt: '',
            traceback: err.stack || ''
          });
        }
      };

      const handleInvokeComlinkWorker = async (fnName) => {
        const worker = workerProxy();
        const b64 = compileResult()?.wasm_b64;
        if (!worker || !b64) return;
        try {
          setErrorReport(null);
          const rawArgs = ((fnArgsInput() || {})[fnName] || []).map(Number);
          const wRes = await worker.executeWasmExport(b64, fnName, rawArgs, 100);
          appendJsLog('PASS', 'WORKER', `Comlink Worker (100x avg): ${wRes.fn_name}(${wRes.args.join(', ')}) = ${wRes.return_value} (${wRes.avg_latency_us} µs)`);
          setLastInvokeResult({
            fn_name: wRes.fn_name,
            args: wRes.args,
            return_value: wRes.return_value,
            latency_us: wRes.avg_latency_us,
            thread: `${wRes.thread} (100-run avg)`
          });
        } catch (err) {
          appendJsLog('ERROR', 'WORKER', err.message);
          setErrorReport({
            error_type: 'ComlinkWorkerError',
            message: err.message,
            lineno: null,
            col_offset: null,
            kernel_name: fnName,
            excerpt: '',
            traceback: err.stack || ''
          });
        }
      };

      const handleHypothesisFuzz = (fnName) => {
        const py = pyodide();
        if (!py) return;
        try {
          setErrorReport(null);
          const res = py.globals.get('run_hypothesis_fuzz')(fnName, 25).toJs({ dict_converter: Object.fromEntries });
          appendJsLog('PASS', 'FUZZ', `Hypothesis verified '${fnName}' (${res.examples_run} cases in ${res.elapsed_ms} ms).`);
          setFuzzResult(res);
          setCompileResult(prev => prev ? ({
            ...prev,
            arrays: res.arrays,
            struct_outs: res.struct_outs,
            arenas: res.arenas,
          }) : prev);
        } catch (err) {
          appendJsLog('ERROR', 'FUZZ', err.message);
          setErrorReport({
            error_type: 'HypothesisFuzzFailure',
            message: err.message,
            lineno: null,
            col_offset: null,
            kernel_name: fnName,
            excerpt: '',
            traceback: err.stack || ''
          });
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setSelectedExampleId('custom');
          setUserCode(String(ev.target?.result || ''));
          appendJsLog('INFO', 'FILE', `Loaded file '${file.name}'.`);
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleCopyBase64 = () => {
        const b64 = compileResult()?.wasm_b64;
        if (!b64) return;
        navigator.clipboard.writeText(b64);
        setCopiedB64(true);
        appendJsLog('INFO', 'EMIT', `Copied Base64 WASM string (${b64.length} chars) to clipboard.`);
        setTimeout(() => setCopiedB64(false), 1500);
      };

      const handleDownloadWasm = () => {
        const b64 = compileResult()?.wasm_b64;
        if (!b64) return;
        const bytes = b64ToUint8Array(b64);
        const blob = new Blob([bytes], { type: 'application/wasm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'module.wasm';
        a.click();
        URL.revokeObjectURL(url);
        appendJsLog('INFO', 'EMIT', `Downloaded module.wasm (${bytes.length} bytes).`);
      };

      const handleInspectExpr = (val) => {
        setExprInput(val);
        const py = pyodide();
        if (!py || !val.trim()) {
          setExprResult(null);
          return;
        }
        try {
          const res = py.globals.get('inspect_single_expr')(val).toJs({ dict_converter: Object.fromEntries });
          setExprResult(res);
        } catch (e) {
          setExprResult({ error: e.message });
        }
      };

      const handleSelectExprExample = (e) => {
        const id = e.target.value;
        setSelectedExprId(id);
        if (id === 'custom') {
          handleInspectExpr('');
          return;
        }
        const found = BUILTIN_EXPR_EXAMPLES.find(item => item.id === id);
        if (found) {
          handleInspectExpr(found.expr);
        }
      };

      const handleLebChange = (val) => {
        const num = parseInt(val, 10) || 0;
        setLebInput(num);
        const py = pyodide();
        if (!py) return;
        const res = py.globals.get('encode_leb_demo')(num).toJs({ dict_converter: Object.fromEntries });
        setLebResult(res);
      };

      const filteredLogs = () => {
        const f = logFilter();
        const all = eventLogs();
        if (f === 'ALL') return all;
        if (f === 'WARN_ERR') return all.filter(l => l.level === 'ERROR' || l.level === 'WARN');
        if (f === 'OPT_PASS') return all.filter(l => l.level === 'OPT' || l.level === 'PASS');
        return all;
      };

      return html`
        <div>
          ${() => !pyodide() ? html`<fieldset><legend>Initializing PyWASM</legend><div>${() => status()}</div></fieldset>` : html`
            <div>
              <div class="bar">
                <strong>PyWASM</strong>
                <span>${() => `[${status()}]`}</span>
                <button
                  onClick=${() => setTab('compiler')}
                  style=${() => `font-weight: ${tab() === 'compiler' ? 'bold' : 'normal'}`}
                >
                  1. Python Compiler
                </button>
                <button
                  onClick=${() => setTab('ast')}
                  style=${() => `font-weight: ${tab() === 'ast' ? 'bold' : 'normal'}`}
                >
                  2. Expr, SymPy CSE & LEB128
                </button>
                <button onClick=${() => setDark(!dark())}>
                  ${() => `Theme: ${dark() ? 'Dark' : 'Light'}`}
                </button>
              </div>

              ${() => tab() === 'compiler' ? html`
                <div class="layout-grid">
                  <!-- LEFT COLUMN: PYTHON EDITOR, STATIC AST ANALYSIS, EVENT LOG CONSOLE -->
                  <div class="layout-col">
                    <fieldset>
                      <legend>Python Code (CodeMirror 6 + asttokens WASM Badges)</legend>
                      <div class="bar">
                        <select ref=${bindValue(selectedExampleId)} onChange=${handleSelectExample}>
                          ${BUILTIN_PYTHON_EXAMPLES.map(ex => html`
                            <option value=${ex.id}>${ex.title}</option>
                          `)}
                          <option value="custom">-- Custom / Blank --</option>
                        </select>
                        <button onClick=${handleCompileUserCode}>Compile & Run (Ctrl+Enter)</button>
                        <input
                          ref=${(el) => { fileInputRef = el; }}
                          type="file"
                          accept=".py,.txt"
                          onChange=${handleFileUpload}
                          style="display:none"
                        />
                        <button onClick=${() => fileInputRef?.click()}>Load .py</button>
                        <button onClick=${() => {
                          setSelectedExampleId('custom');
                          setUserCode('');
                          setCompileResult(null);
                          setErrorReport(null);
                        }}>Clear</button>
                      </div>
                      <div class="cm-host-py" ref=${mountPythonEditor}></div>
                    </fieldset>

                    ${() => {
                      const res = compileResult();
                      if (!res || !res.functions?.length) return null;
                      return html`
                        <fieldset>
                          <legend>Static AST Analysis (SymPy + Gast/Beniget)</legend>
                          ${res.functions.map(fn => html`
                            <div style="margin-bottom:6px">
                              <div><strong>${`Kernel $${fn.name}:`}</strong></div>
                              ${fn.sympy_rewrites?.length > 0 ? fn.sympy_rewrites.map(rw => html`
                                <div>
                                  <span>${`• SymPy Horner/Simplify (L${rw.line}): `}</span>
                                  <code>${rw.original}</code>
                                  <span> → </span>
                                  <code>${rw.simplified}</code>
                                </div>
                              `) : html`<div>• SymPy: No reducible scalar polynomials detected</div>`}
                              ${fn.beniget_report?.enabled ? html`
                                <div>
                                  <span>• Beniget Def-Use: </span>
                                  <span>${fn.beniget_report.defs.map(d => `${d.symbol}(${d.uses} uses)`).join(', ')}</span>
                                  <span>${fn.beniget_report.dead_locals?.length > 0
                                    ? ` | Dead Locals: ${fn.beniget_report.dead_locals.join(', ')}`
                                    : ' | 0 Dead Locals'}</span>
                                  <span>${fn.beniget_report.loop_invariants?.length > 0
                                    ? ` | Loop-Invariants: [${fn.beniget_report.loop_invariants.join(', ')}]`
                                    : ''}</span>
                                </div>
                              ` : null}
                            </div>
                          `)}
                        </fieldset>
                      `;
                    }}

                    <fieldset>
                      <legend>${() => `Compiler & Execution Log (${filteredLogs().length} entries)`}</legend>
                      <div class="bar">
                        <button
                          onClick=${() => setLogFilter('ALL')}
                          style=${() => `font-weight: ${logFilter() === 'ALL' ? 'bold' : 'normal'}`}
                        >All</button>
                        <button
                          onClick=${() => setLogFilter('WARN_ERR')}
                          style=${() => `font-weight: ${logFilter() === 'WARN_ERR' ? 'bold' : 'normal'}`}
                        >Warnings & Errors</button>
                        <button
                          onClick=${() => setLogFilter('OPT_PASS')}
                          style=${() => `font-weight: ${logFilter() === 'OPT_PASS' ? 'bold' : 'normal'}`}
                        >Optimizations & Passes</button>
                        <button onClick=${() => setEventLogs([])}>Clear Log</button>
                      </div>
                      <div class="log-console">
                        ${() => {
                          const list = filteredLogs();
                          if (list.length === 0) return html`<div>No log events matching filter.</div>`;
                          return list.slice().reverse().map(entry => html`
                            <div class="log-entry">
                              <span style="opacity:0.6">${entry.time}</span>
                              <span class=${`log-lvl-${entry.level}`}>${`[${entry.level}:${entry.phase}]`}</span>
                              ${entry.line ? html`
                                <button
                                  style="padding:0 4px;font-size:11px"
                                  onClick=${() => jumpToEditorLine(entry.line)}
                                >${`L${entry.line}`}</button>
                              ` : null}
                              <span>${entry.message}</span>
                            </div>
                          `);
                        }}
                      </div>
                    </fieldset>
                  </div>

                  <!-- RIGHT COLUMN: ERROR DIAGNOSTICS, BASE64 WASM, EXECUTION, DISASSEMBLY, ARENAS -->
                  <div class="layout-col">
                    ${() => {
                      const err = errorReport();
                      if (!err) return null;
                      return html`
                        <fieldset class="error-box">
                          <legend>${`Diagnostic Error — ${err.error_type}`}</legend>
                          <div class="bar">
                            <strong>${err.message}</strong>
                            ${err.lineno ? html`
                              <button onClick=${() => jumpToEditorLine(err.lineno)}>
                                ${`Jump to Line ${err.lineno}${err.col_offset != null ? `:${err.col_offset}` : ''}`}
                              </button>
                            ` : null}
                            ${err.kernel_name ? html`<span>${`[Kernel: @${err.kernel_name}]`}</span>` : null}
                            <button onClick=${() => setErrorReport(null)}>Dismiss</button>
                          </div>
                          ${err.excerpt ? html`<pre>${err.excerpt}</pre>` : null}
                          ${err.traceback ? html`<pre>${err.traceback}</pre>` : null}
                        </fieldset>
                      `;
                    }}

                    <fieldset>
                      <legend>${() => {
                        const sz = compileResult()?.wasm_size || 0;
                        const w = wabtStatus();
                        const wTag = w ? (w.valid ? ' — WABT Valid: PASS' : ' — WABT Valid: FAIL') : '';
                        return `Base64 WASM Output (${sz} bytes)${wTag}`;
                      }}</legend>
                      <div class="bar">
                        <button disabled=${() => !compileResult()?.wasm_b64} onClick=${handleCopyBase64}>
                          ${() => copiedB64() ? 'Copied' : 'Copy Base64'}
                        </button>
                        <button disabled=${() => !compileResult()?.wasm_b64} onClick=${handleDownloadWasm}>
                          Download .wasm
                        </button>
                        ${() => {
                          const b = binaryenStats();
                          if (!b || b.error) return null;
                          return html`
                            <button
                              disabled=${() => b.applied}
                              onClick=${handleApplyBinaryenOptimization}
                            >
                              ${() => b.applied
                                ? `Binaryen -O3 Applied (${b.optSize}B)`
                                : `Apply Binaryen -O3 (${b.rawSize}B → ${b.optSize}B)`}
                            </button>
                          `;
                        }}
                      </div>
                      <textarea
                        rows="3"
                        readonly
                        ref=${bindValue(() => compileResult()?.wasm_b64 || '')}
                        placeholder="Base64 encoded .wasm binary will appear here after compilation..."
                      ></textarea>
                      ${() => {
                        const secs = compileResult()?.section_sizes;
                        if (!secs || Object.keys(secs).length === 0) return null;
                        return html`
                          <div style="margin-top:4px;font-size:12px;opacity:0.85">
                            ${Object.entries(secs).map(([k, v]) => `${k}: ${v}`).join(' | ')}
                          </div>
                        `;
                      }}
                    </fieldset>

                    ${() => {
                      const res = compileResult();
                      if (!res) return null;
                      return html`
                        <div>
                          <fieldset>
                            <legend>${`Execution Output (${res.elapsed_ms} ms)`}</legend>
                            ${res.stdout ? html`<pre>${res.stdout}</pre>` : null}
                            ${Object.keys(res.summary || {}).length > 0 ? html`
                              <table>
                                <thead><tr><th>Variable</th><th>Value</th></tr></thead>
                                <tbody>
                                  ${Object.entries(res.summary).map(([k, v]) => html`
                                    <tr><td>${k}</td><td>${Array.isArray(v) ? JSON.stringify(v) : String(v)}</td></tr>
                                  `)}
                                </tbody>
                              </table>
                            ` : null}
                          </fieldset>

                          ${res.functions?.length > 0 ? html`
                            <div>
                              <fieldset>
                                <legend>Exported WASM Functions (Main Thread, Comlink Worker & Hypothesis Fuzz)</legend>
                                ${res.functions.map(fn => html`
                                  <div class="bar">
                                    <strong>${`${fn.name}(${fn.params.map((t, i) => `${fn.param_names?.[i] || `p${i}`}:${t}`).join(', ')}) → ${fn.ret}`}</strong>
                                    ${fn.params.map((ptype, idx) => html`
                                      <input
                                        type="number"
                                        step=${ptype === 'f32' ? 'any' : '1'}
                                        style="width:66px"
                                        ref=${bindValue(() => (fnArgsInput()[fn.name] || [])[idx] ?? '0')}
                                        onInput=${(e) => {
                                          const curMap = fnArgsInput();
                                          const cur = [...(curMap[fn.name] || fn.params.map(() => '0'))];
                                          cur[idx] = e.target.value;
                                          setFnArgsInput({ ...curMap, [fn.name]: cur });
                                        }}
                                      />
                                    `)}
                                    <button onClick=${() => handleInvokeFunction(fn.name)}>Call</button>
                                    <button onClick=${() => handleInvokeComlinkWorker(fn.name)}>Comlink Worker</button>
                                    <button onClick=${() => handleHypothesisFuzz(fn.name)}>Hypothesis Fuzz</button>
                                  </div>
                                `)}
                                ${() => {
                                  const inv = lastInvokeResult();
                                  return inv ? html`
                                    <pre>${`[${inv.thread}] ${inv.fn_name}(${inv.args.join(', ')}) = ${String(inv.return_value)} (${inv.latency_us} µs)`}</pre>
                                  ` : null;
                                }}
                                ${() => {
                                  const fz = fuzzResult();
                                  return fz ? html`
                                    <pre>${`[Hypothesis] ${fz.fn_name}: ${fz.examples_run} generated cases — ${fz.status} (${fz.elapsed_ms} ms)\nSamples: ${fz.samples.map(s => `${fz.fn_name}(${s.args.join(', ')}) -> ${s.ret}`).join(' | ')}`}</pre>
                                  ` : null;
                                }}
                              </fieldset>

                              <fieldset>
                                <legend>Disassembly (CodeMirror 6 @codemirror/lang-wast)</legend>
                                <div class="bar">
                                  <button
                                    onClick=${() => setDisasmMode('annotated')}
                                    style=${() => `font-weight: ${disasmMode() === 'annotated' ? 'bold' : 'normal'}`}
                                  >
                                    PyWASM + asttokens Line Map
                                  </button>
                                  <button
                                    onClick=${() => setDisasmMode('wabt')}
                                    style=${() => `font-weight: ${disasmMode() === 'wabt' ? 'bold' : 'normal'}`}
                                  >
                                    WABT Standard WAT
                                  </button>
                                  <button
                                    onClick=${() => setDisasmMode('binaryen')}
                                    style=${() => `font-weight: ${disasmMode() === 'binaryen' ? 'bold' : 'normal'}`}
                                  >
                                    Binaryen -O3 WAT
                                  </button>
                                </div>
                                <div class="cm-host-wat" ref=${mountWatViewer}></div>
                              </fieldset>
                            </div>
                          ` : null}

                          ${(res.struct_outs?.length > 0 || res.arrays?.length > 0 || res.arenas?.length > 0) ? html`
                            <fieldset>
                              <legend>Memory, NumPy Stats & SoAArenas</legend>
                              ${res.struct_outs?.map(so => html`
                                <div><strong>${`StructOut ${so.name}: `}</strong><span>${JSON.stringify(so.fields)}</span></div>
                              `)}
                              ${res.arrays?.map(arr => html`
                                <div>
                                  <strong>${`${arr.name} (${arr.dtype}[${arr.capacity}], @${arr.byte_offset}B): `}</strong>
                                  <span>${`[${arr.preview.join(', ')}${arr.capacity > arr.preview.length ? ', ...' : ''}]${arr.np_stats ? ` | NumPy(min=${arr.np_stats.min}, max=${arr.np_stats.max}, mean=${arr.np_stats.mean})` : ''}`}</span>
                                </div>
                              `)}
                              ${res.arenas?.map(ar => html`
                                <div>
                                  <strong>${`SoAArena ${ar.name} (cursor=${ar.cursor}/${ar.capacity}, holes=${ar.reclaimable}, numpy=${String(ar.numpy_backed)}): `}</strong>
                                  <span>${JSON.stringify(ar.previews)}</span>
                                </div>
                              `)}
                            </fieldset>
                          ` : null}
                        </div>
                      `;
                    }}
                  </div>
                </div>
              ` : null}

              ${() => tab() === 'ast' ? html`
                <div class="layout-grid">
                  <div class="layout-col">
                    <fieldset>
                      <legend>Python WASM Expr & SymPy CSE Inspector</legend>
                      <p>Locals in scope: a, b (f32) | i, j (i32) | v1, v2 (v128) | arr (f32[64])</p>
                      <div class="bar">
                        <select ref=${bindValue(selectedExprId)} onChange=${handleSelectExprExample} style="width:100%">
                          ${BUILTIN_EXPR_EXAMPLES.map(ex => html`
                            <option value=${ex.id}>${ex.title}</option>
                          `)}
                          <option value="custom">-- Custom Expression --</option>
                        </select>
                      </div>
                      <input
                        type="text"
                        style="width:100%"
                        ref=${bindValue(exprInput)}
                        placeholder="Enter custom Python WASM Expr (e.g. a + b)"
                        onInput=${(e) => {
                          setSelectedExprId('custom');
                          handleInspectExpr(e.target.value);
                        }}
                      />
                      ${() => {
                        const r = exprResult();
                        if (!r) return null;
                        if (r.error) return html`<pre>${r.error}</pre>`;
                        return html`
                          <div>
                            <pre>${`Type: ${r.vtype} | ByteOffset: ${String(r.is_byte_offset)} | Size: ${r.byte_len}B\nBase64: ${r.b64}\nHex:    ${r.hex}\n\n${r.instructions.map(ins => `+0x${ins.offset.toString(16).padStart(2, '0')}  ${ins.hex.padEnd(12, ' ')} ${ins.text}`).join('\n')}`}</pre>
                            ${r.sympy_info ? html`
                              <pre>${`SymPy Algebraic Analysis:\n  Simplified: ${r.sympy_info.simplified}\n  Horner:     ${r.sympy_info.horner}\n  CSE Temps:  ${r.sympy_info.cse_temps.length ? r.sympy_info.cse_temps.join(', ') : '(none)'}\n  CSE Output: ${r.sympy_info.cse_result}`}</pre>
                            ` : null}
                          </div>
                        `;
                      }}
                    </fieldset>
                  </div>

                  <div class="layout-col">
                    <fieldset>
                      <legend>LEB128 Encoder</legend>
                      <input
                        type="number"
                        style="width:100%"
                        ref=${bindValue(lebInput)}
                        onInput=${(e) => handleLebChange(e.target.value)}
                      />
                      ${() => {
                        const l = lebResult();
                        return l ? html`
                          <pre>${`Signed   Hex: ${l.s_hex} | Base64: ${l.s_b64}\nUnsigned Hex: ${l.u_hex} | Base64: ${l.u_b64}`}</pre>
                        ` : null;
                      }}
                    </fieldset>
                  </div>
                </div>
              ` : null}
            </div>
          `}
        </div>
      `;
    }

    render(App, document.getElementById('app'));
    // # endregion
  </script>
</body>
</html>
