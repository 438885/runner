<!--
===============================================================================
PyWASM — Minimal Python-to-WebAssembly (WASM + SIMD) AST Compiler
===============================================================================

1. WHAT THIS APPLICATION IS:
   PyWASM is a self-contained, single-file browser application powered by Pyodide,
   SolidJS 2.0, and Tailwind CSS v4 that compiles standard Python syntax directly into
   native WebAssembly (.wasm) bytecode, including 128-bit 4-wide SIMD (v128) vector
   instructions, directly in the browser without requiring external offline toolchains.
   It integrates in-browser symbolic AST optimization (sympy), static Def-Use dataflow
   analysis (gast, beniget), source-to-bytecode line mapping (asttokens), vectorized
   C-buffer memory views (numpy), property-based kernel fuzzing (hypothesis), binary
   validation (wabt), -O3 SIMD binary optimization (binaryen), CodeMirror 6 editors
   (@codemirror/view, @codemirror/lang-python, @codemirror/lang-wast), and off-thread
   Web Worker execution (comlink).

2. WHAT IT DOES:
   - Compiles Python functions decorated with `@mod.kernel` into standalone
     WebAssembly modules.
   - Performs static AST Def-Use analysis (`beniget` / `gast` dead-store and
     loop-invariant detection) and algebraic polynomial simplification / Horner
     factoring (`sympy`) prior to opcode emission.
   - Outputs portable Base64-encoded `.wasm` binaries, section-by-section byte
     breakdowns, and downloadable `.wasm` files alongside a 3-mode CodeMirror 6
     WAT disassembler (`PyWASM + asttokens Line Map`, `WABT Standard WAT`, and
     `Binaryen -O3 WAT`) with `wabt` binary validation and one-click `binaryen`
     `-O3` binary hot-swapping.
   - Manages shared linear memory between Python and WebAssembly using typed
     arrays (`MemoryArray`), 4-wide SIMD views (`arr.v128[...]`), named scalar
     telemetry slots (`StructOut`), and NumPy-vectorized C-buffer Structure-of-Arrays
     arenas (`SoAArena`) with zero-copy `memoryview` and `np.frombuffer` synchronization.
   - Provides an interactive runner for invoking compiled WASM exports on the main
     thread, benchmarking 100-run averages off-thread in a `Comlink` Web Worker, or
     running property-based determinism and finiteness fuzz testing via `hypothesis`.
   - Includes a filterable Compiler & Execution Log console, line-accurate
     `WasmASTCompileError` diagnostics with CodeMirror inline error badges and
     Jump-to-Line navigation, plus an interactive `Expr` stack-bytecode, `SymPy`
     Common Subexpression Elimination (CSE), and LEB128 encoding inspector.

3. HOW IT WORKS:
   - LEB128, Binary Emitter & Section Profiler (Regions 1 & 6): Encodes WebAssembly
     Type (0x01), Function (0x03), Memory (0x05), Export (0x07), and Code (0x0A)
     sections directly in Python `bytearray` buffers using unsigned/signed LEB128,
     recording per-section byte sizes and structured compiler log events.
   - Typed Stack Expressions (Region 2): The `Expr` and `LocalVar` classes
     overload Python operators (`+`, `-`, `*`, `/`, `%`, `&`, `|`, `^`, `~`, `<<`,
     `>>`, `<`, `<=`, `>`, `>=`) to emit type-appropriate WASM opcodes (`i32`,
     `f32`, or `v128` SIMD) onto the function's instruction stream.
   - Python AST Compiler, Symbolic Lowering & Static Analysis (Regions 4 & 5):
     `_ASTKernelCompiler` (an `ast.NodeVisitor`) parses Python functions via
     `inspect.getsourcelines` + `ast.parse` + `asttokens.ASTTokens`, runs `gast`
     and `beniget` `DefUseChains` / `UseDefChains` analysis, rewrites scalar
     polynomial arithmetic subtrees via `sympy.simplify` and `sympy.horner`, and
     translates annotated locals, `for i in range(...)`, `while`, `if/else`,
     `break`, `continue`, and ternary `a if cond else b` (`select`) into structured
     WebAssembly blocks (`block`, `loop`, `br`, `br_if`, `if/else/end`). Compile-time
     boolean flags (such as `if use_simd:`) are statically evaluated to dead-strip
     unused branches, and every emitted instruction offset is mapped back to its
     originating Python source line.
   - Shared Memory, NumPy Vectorization & Instantiation (Regions 3, 6 & 7):
     `WasmModule.instantiate()` compiles the emitted bytes via the browser's
     `WebAssembly.Instance` API and binds `Float32Array` / `Int32Array` views over
     `exports.mem.buffer` at 16-byte aligned offsets. `SoAArena` wraps its C-buffers
     with zero-copy `np.frombuffer` views and vectorizes 4-wide spatial bounding-box
     chunk reductions via `np.minimum.reduceat` and `np.maximum.reduceat`.
   - Disassembler, Diagnostics, Fuzzing & Frontend Bridge (Regions 8–12):
     `disassemble_code()` decodes scalar and `0xFD` SIMD opcodes alongside `asttokens`
     source-line spans; `_build_error_report()` extracts exact line/column caret
     excerpts and filtered tracebacks; `run_hypothesis_fuzz()` executes property-based
     checks over generated `i32`/`f32` strategies; and the SolidJS 2.0 frontend
     coordinates CodeMirror 6 editors (with per-line emitted WASM byte/op badges),
     `wabt` validation, `binaryen` `-O3` optimization, and `Comlink` Web Worker RPC.
===============================================================================

  <script id="python-compiler-lib" type="text/python">
import ast
import inspect
import linecache
import math
import struct
import textwrap
import traceback
from array import array
from contextlib import contextmanager

try:
    import js
    HAS_JS = True
except ImportError:
    HAS_JS = False

try:
    import numpy as np
    HAS_NUMPY = True
except ImportError:
    np = None
    HAS_NUMPY = False

try:
    import sympy
    HAS_SYMPY = True
except ImportError:
    sympy = None
    HAS_SYMPY = False

try:
    import asttokens
    HAS_ASTTOKENS = True
except ImportError:
    asttokens = None
    HAS_ASTTOKENS = False

try:
    import gast
    import beniget
    HAS_BENIGET = True
except ImportError:
    gast = None
    beniget = None
    HAS_BENIGET = False

try:
    import hypothesis
    from hypothesis import given, settings, HealthCheck, strategies as st
    HAS_HYPOTHESIS = True
except ImportError:
    hypothesis = None
    HAS_HYPOTHESIS = False

# region 1 wasm_types_and_leb128
I32, I64, F32, F64, V128 = 0x7F, 0x7E, 0x7D, 0x7C, 0x7B
TYPE_MAP = {"i32": I32, "i64": I64, "f32": F32, "f64": F64, "v128": V128, "byte_offset": I32}
ITEM_SIZE = {"i32": 4, "i64": 8, "f32": 4, "f64": 8, "v128": 16}

_ACTIVE_FN: "FuncBuilder | None" = None
_COMPILER_LOGS: list[dict] = []


def log_compiler_event(level: str, phase: str, message: str, line: int | None = None):
    _COMPILER_LOGS.append({
        "level": level,
        "phase": phase,
        "message": message,
        "line": line,
    })


def leb128_u(v: int) -> bytes:
    out = bytearray()
    while True:
        b = v & 0x7F
        v >>= 7
        if v:
            out.append(b | 0x80)
        else:
            out.append(b)
            return bytes(out)


def leb128_s(v: int) -> bytes:
    v &= 0xFFFFFFFF
    if v >= 0x80000000:
        v -= 0x100000000
    out = bytearray()
    while True:
        b = v & 0x7F
        v >>= 7
        if (v == 0 and (b & 0x40) == 0) or (v == -1 and (b & 0x40) != 0):
            out.append(b)
            return bytes(out)
        out.append(b | 0x80)


def encode_section(sec_id: int, payload: bytes) -> bytes:
    return bytes([sec_id]) + leb128_u(len(payload)) + payload
# endregion


# region 2 typed_wasm_expressions_and_simd_intrinsics
class Expr:
    def __init__(self, code: bytes, vtype: int, is_byte_offset: bool = False):
        self.code = bytes(code)
        self.vtype = vtype
        self.is_byte_offset = is_byte_offset

    def _coerce(self, other) -> "Expr":
        if isinstance(other, Expr):
            return other
        if isinstance(other, (int, bool)) and self.vtype == I32:
            return i32(int(other))
        if isinstance(other, (int, float)) and self.vtype == F32:
            return f32(float(other))
        if isinstance(other, (int, float)) and self.vtype == V128:
            return f32(float(other)).splat()
        raise TypeError(f"Cannot coerce {other!r} to WASM type {hex(self.vtype)}")

    def _binop(self, other, op_i32=None, op_f32=None, op_v128=None, out_type=None) -> "Expr":
        rhs = self._coerce(other)
        t = self.vtype
        op = {I32: op_i32, F32: op_f32, V128: op_v128}.get(t)
        if op is None:
            raise TypeError(f"Unsupported operation for WASM type {hex(t)}")
        return Expr(self.code + rhs.code + op, out_type or t)

    def __add__(self, o): return self._binop(o, b"\x6A", b"\x92", b"\xFD\xE4\x01")
    def __radd__(self, o): return self._coerce(o).__add__(self)
    def __sub__(self, o): return self._binop(o, b"\x6B", b"\x93", b"\xFD\xE5\x01")
    def __rsub__(self, o): return self._coerce(o).__sub__(self)
    def __mul__(self, o): return self._binop(o, b"\x6C", b"\x94", b"\xFD\xE6\x01")
    def __rmul__(self, o): return self._coerce(o).__mul__(self)
    def __truediv__(self, o): return self._binop(o, b"\x6D", b"\x95", b"\xFD\xE7\x01")
    def __rtruediv__(self, o): return self._coerce(o).__truediv__(self)
    def __mod__(self, o): return self._binop(o, b"\x6F")
    def __neg__(self):
        if self.vtype == F32: return Expr(self.code + b"\x8C", F32)
        if self.vtype == V128: return Expr(self.code + b"\xFD\xE1\x01", V128)
        return i32(0) - self

    def __and__(self, o): return self._binop(o, b"\x71", None, b"\xFD\x4E")
    def __or__(self, o):  return self._binop(o, b"\x72", None, b"\xFD\x50")
    def __xor__(self, o): return self._binop(o, b"\x73", None, b"\xFD\x51")
    def __invert__(self):
        if self.vtype == V128: return Expr(self.code + b"\xFD\x4D", V128)
        return self ^ i32(-1)
    def __lshift__(self, o): return self._binop(o, b"\x74")
    def __rshift__(self, o): return self._binop(o, b"\x75")
    def shr_u(self, o):      return self._binop(o, b"\x76")

    def __lt__(self, o): return self._binop(o, b"\x48", b"\x5D", b"\xFD\x43", I32 if self.vtype != V128 else V128)
    def __gt__(self, o): return self._binop(o, b"\x4A", b"\x5E", b"\xFD\x44", I32 if self.vtype != V128 else V128)
    def __le__(self, o): return self._binop(o, b"\x4C", b"\x5F", b"\xFD\x45", I32 if self.vtype != V128 else V128)
    def __ge__(self, o): return self._binop(o, b"\x4E", b"\x60", b"\xFD\x46", I32 if self.vtype != V128 else V128)
    def eq(self, o):     return self._binop(o, b"\x46", b"\x5B", b"\xFD\x41", I32 if self.vtype != V128 else V128)
    def ne(self, o):     return self._binop(o, b"\x47", b"\x5C", b"\xFD\x42", I32 if self.vtype != V128 else V128)
    def lt_u(self, o):   return self._binop(o, b"\x49", out_type=I32)
    def gt_u(self, o):   return self._binop(o, b"\x4B", out_type=I32)
    def le_u(self, o):   return self._binop(o, b"\x4D", out_type=I32)
    def ge_u(self, o):   return self._binop(o, b"\x4F", out_type=I32)

    def eqz(self) -> "Expr": return Expr(self.code + b"\x45", I32)
    def abs(self) -> "Expr": return Expr(self.code + ({F32: b"\x8B", V128: b"\xFD\xE0\x01"}[self.vtype]), self.vtype)
    def sqrt(self) -> "Expr": return Expr(self.code + ({F32: b"\x91", V128: b"\xFD\xE3\x01"}[self.vtype]), self.vtype)
    def floor(self) -> "Expr": return Expr(self.code + ({F32: b"\x8E", V128: b"\xFD\x67"}[self.vtype]), self.vtype)
    def ceil(self) -> "Expr": return Expr(self.code + ({F32: b"\x8D", V128: b"\xFD\x66"}[self.vtype]), self.vtype)
    def min(self, o) -> "Expr": return self._binop(o, None, b"\x96", b"\xFD\xEC\x01")
    def max(self, o) -> "Expr": return self._binop(o, None, b"\x97", b"\xFD\xED\x01")
    def clamp(self, lo, hi) -> "Expr": return self.max(lo).min(hi)

    def to_f32(self) -> "Expr": return Expr(self.code + b"\xB2", F32)
    def to_i32(self) -> "Expr": return Expr(self.code + b"\xA8", I32)
    def bitcast_f32(self) -> "Expr": return Expr(self.code + b"\xBE", F32)
    def bitcast_i32(self) -> "Expr": return Expr(self.code + b"\xBC", I32)

    def splat(self) -> "Expr":
        op = {F32: b"\xFD\x13", I32: b"\xFD\x11"}[self.vtype]
        return Expr(self.code + op, V128)

    def any_true(self) -> "Expr": return Expr(self.code + b"\xFD\x53", I32)
    def all_true(self) -> "Expr": return Expr(self.code + b"\xFD\xA3\x01", I32)


def i32(val: int) -> Expr:
    return Expr(b"\x41" + leb128_s(int(val)), I32)


def f32(val: float) -> Expr:
    return Expr(b"\x43" + struct.pack("<f", float(val)), F32)


def byte_offset(index_expr) -> Expr:
    if isinstance(index_expr, Expr) and index_expr.is_byte_offset:
        return index_expr
    expr = index_expr if isinstance(index_expr, Expr) else i32(index_expr)
    return Expr((expr << 2).code, I32, is_byte_offset=True)


def select(cond: Expr, true_val, false_val) -> Expr:
    t_expr = true_val if isinstance(true_val, Expr) else f32(true_val)
    f_expr = t_expr._coerce(false_val)
    return Expr(t_expr.code + f_expr.code + cond.code + b"\x1B", t_expr.vtype)


def murmur_hash32(seed: Expr, idx: Expr) -> Expr:
    h = seed ^ (idx * i32(0xC2B2AE3D))
    h = (h ^ h.shr_u(16)) * i32(0x7FEB352D)
    h = (h ^ h.shr_u(15)) * i32(0x846CA68B)
    return h ^ h.shr_u(16)


class LocalVar(Expr):
    def __init__(self, fn: "FuncBuilder", name: str, idx: int, vtype: int, is_byte_offset: bool = False):
        super().__init__(b"\x20" + leb128_u(idx), vtype, is_byte_offset=is_byte_offset)
        self.fn = fn
        self.name = name
        self.idx = idx

    def set(self, val):
        if isinstance(val, Expr) and val.is_byte_offset:
            self.is_byte_offset = True
        expr = self._coerce(val)
        self.fn._emit(expr.code + b"\x21" + leb128_u(self.idx))

    def tee(self, val) -> Expr:
        if isinstance(val, Expr) and val.is_byte_offset:
            self.is_byte_offset = True
        expr = self._coerce(val)
        return Expr(expr.code + b"\x22" + leb128_u(self.idx), self.vtype, is_byte_offset=self.is_byte_offset)
# endregion


# region 3 declarative_arrays_simd_views_and_struct_out
class SimdArrayView:
    def __init__(self, arr: "MemoryArray"):
        self.arr = arr

    def __getitem__(self, index) -> Expr:
        addr_code, static_off = self.arr._addr(index)
        return Expr(addr_code + b"\xFD\x00\x02" + leb128_u(static_off), V128)

    def __setitem__(self, index, val: Expr):
        if _ACTIVE_FN is None:
            raise RuntimeError("SIMD store must occur inside a WASM function builder or @kernel.")
        addr_code, static_off = self.arr._addr(index)
        _ACTIVE_FN._emit(addr_code + val.code + b"\xFD\x0B\x02" + leb128_u(static_off))


class MemoryArray:
    def __init__(self, module: "WasmModule", name: str, dtype: str, capacity: int, byte_offset: int):
        self.module = module
        self.name = name
        self.dtype = dtype
        self.vtype = TYPE_MAP[dtype]
        self.capacity = capacity
        self.byte_offset = byte_offset
        self.byte_length = capacity * ITEM_SIZE[dtype]
        self.v128 = SimdArrayView(self)

    def _addr(self, index) -> tuple[bytes, int]:
        if isinstance(index, int):
            return i32(0).code, self.byte_offset + (index << 2)
        if isinstance(index, Expr) and index.is_byte_offset:
            return index.code, self.byte_offset
        idx_expr = index if isinstance(index, Expr) else i32(index)
        return (idx_expr << 2).code, self.byte_offset

    def __getitem__(self, index) -> Expr:
        addr_code, static_off = self._addr(index)
        load_op = b"\x28\x02" if self.vtype == I32 else b"\x2A\x02"
        return Expr(addr_code + load_op + leb128_u(static_off), self.vtype)

    def __setitem__(self, index, val):
        if _ACTIVE_FN is None:
            raise RuntimeError("Array assignment `arr[i] = val` must be inside an active WASM function.")
        _ACTIVE_FN.store(self, index, val)


class StructOut:
    def __init__(self, arr: MemoryArray, fields: list[str]):
        object.__setattr__(self, "_arr", arr)
        object.__setattr__(self, "_fields", {name: idx for idx, name in enumerate(fields)})
        object.__setattr__(self, "_runtime_view", None)

    def _bind_runtime(self, view):
        object.__setattr__(self, "_runtime_view", view)

    def __getattr__(self, name: str):
        fields = object.__getattribute__(self, "_fields")
        if name not in fields:
            raise AttributeError(f"No field '{name}' in StructOut")
        idx = fields[name]
        if _ACTIVE_FN is not None:
            return object.__getattribute__(self, "_arr")[idx]
        view = object.__getattribute__(self, "_runtime_view")
        return view[idx]

    def __setattr__(self, name: str, val):
        fields = object.__getattribute__(self, "_fields")
        if name not in fields:
            raise AttributeError(f"No field '{name}' in StructOut")
        idx = fields[name]
        if _ACTIVE_FN is not None:
            _ACTIVE_FN.store(object.__getattribute__(self, "_arr"), idx, val)
        else:
            view = object.__getattribute__(self, "_runtime_view")
            view[idx] = val

    def unpack(self, *field_names: str) -> tuple:
        view = object.__getattribute__(self, "_runtime_view")
        fields = object.__getattribute__(self, "_fields")
        names = field_names or list(fields.keys())
        return tuple(float(view[fields[n]]) if object.__getattribute__(self, "_arr").dtype == "f32" else int(view[fields[n]]) for n in names)

    def to_dict(self) -> dict:
        fields = object.__getattribute__(self, "_fields")
        vals = self.unpack(*fields.keys())
        return dict(zip(fields.keys(), vals))

class ControlLabel:
    def __init__(self, depth: int):
        self.depth = depth


class FuncBuilder:
    def __init__(self, name: str, ret_type: str | None = "i32"):
        self.name = name
        self.ret_type = TYPE_MAP[ret_type] if ret_type else None
        self.params: list[int] = []
        self.param_names: list[str] = []
        self.locals: list[int] = []
        self.named_vars: dict[str, LocalVar] = {}
        self.code = bytearray()
        self._depth = 0
        self._prev_fn = None
        # asttokens source-line tracking & sympy/beniget metadata
        self._current_line: int | None = None
        self._current_col: int | None = None
        self._current_src: str = ""
        self.line_spans: list[tuple[int, int, int, str]] = []
        self.sympy_rewrites: list[dict] = []
        self.beniget_report: dict = {}
        self.py_fn = None

    def __enter__(self) -> "FuncBuilder":
        global _ACTIVE_FN
        self._prev_fn = _ACTIVE_FN
        _ACTIVE_FN = self
        return self

    def __exit__(self, exc_type, exc_val, exc_tb):
        global _ACTIVE_FN
        _ACTIVE_FN = self._prev_fn

    def param(self, name: str, dtype: str = "i32") -> LocalVar:
        if self.locals:
            raise RuntimeError("Declare all parameters before locals.")
        vtype = TYPE_MAP[dtype]
        idx = len(self.params)
        self.params.append(vtype)
        self.param_names.append(name)
        var = LocalVar(self, name, idx, vtype, is_byte_offset=(dtype == "byte_offset"))
        self.named_vars[name] = var
        return var

    def local(self, name: str, dtype: str = "i32", init=None) -> LocalVar:
        if name in self.named_vars:
            var = self.named_vars[name]
            if init is not None:
                var.set(init)
            return var
        if dtype not in TYPE_MAP:
            raise TypeError(f"Unknown WASM local type annotation '{dtype}' for variable '{name}'. Expected one of: {list(TYPE_MAP.keys())}")
        vtype = TYPE_MAP[dtype]
        idx = len(self.params) + len(self.locals)
        self.locals.append(vtype)
        is_bo = (dtype == "byte_offset") or (isinstance(init, Expr) and init.is_byte_offset)
        var = LocalVar(self, name, idx, vtype, is_byte_offset=is_bo)
        self.named_vars[name] = var
        if init is not None:
            var.set(init)
        return var

    def _emit(self, raw: bytes):
        start_off = len(self.code)
        self.code.extend(raw)
        end_off = len(self.code)
        if self._current_line is not None and end_off > start_off:
            self.line_spans.append((start_off, end_off, self._current_line, self._current_src))

    def store(self, arr: MemoryArray, index, val):
        addr_code, static_off = arr._addr(index)
        val_expr = val if isinstance(val, Expr) else (i32(val) if arr.vtype == I32 else f32(float(val)))
        store_op = b"\x36\x02" if arr.vtype == I32 else b"\x38\x02"
        self._emit(addr_code + val_expr.code + store_op + leb128_u(static_off))

    @contextmanager
    def block(self):
        lbl = ControlLabel(self._depth)
        self._depth += 1
        self._emit(b"\x02\x40")
        try:
            yield lbl
        finally:
            self._depth -= 1
            self._emit(b"\x0B")

    @contextmanager
    def loop(self):
        lbl = ControlLabel(self._depth)
        self._depth += 1
        self._emit(b"\x03\x40")
        try:
            yield lbl
        finally:
            self._depth -= 1
            self._emit(b"\x0B")

    @contextmanager
    def while_loop(self, cond: Expr | None = None):
        with self.block() as brk, self.loop() as cont:
            if cond is not None:
                self.br_if(cond.eqz(), brk)
            yield brk, cont
            self.br(cont)

    @contextmanager
    def if_(self, cond: Expr):
        self._emit(cond.code + b"\x04\x40")
        self._depth += 1
        try:
            yield
        finally:
            self._depth -= 1
            self._emit(b"\x0B")

    def else_(self):
        self._emit(b"\x05")

    def _rel_depth(self, label: ControlLabel) -> int:
        rel = self._depth - label.depth - 1
        if rel < 0:
            raise ValueError("Target label is out of scope.")
        return rel

    def br(self, label: ControlLabel):
        self._emit(b"\x0C" + leb128_u(self._rel_depth(label)))

    def br_if(self, cond: Expr, label: ControlLabel):
        self._emit(cond.code + b"\x0D" + leb128_u(self._rel_depth(label)))

    def ret(self, val=None):
        if val is not None:
            expr = val if isinstance(val, Expr) else (i32(val) if self.ret_type == I32 else f32(float(val)))
            self._emit(expr.code)
        self._emit(b"\x0F")

    def encode_signature(self) -> bytes:
        res = bytes([1, self.ret_type]) if self.ret_type else b"\x00"
        return bytes([0x60]) + leb128_u(len(self.params)) + bytes(self.params) + res

    def encode_body(self) -> bytes:
        runs = []
        for ltype in self.locals:
            if runs and runs[-1][1] == ltype:
                runs[-1][0] += 1
            else:
                runs.append([1, ltype])
        loc_bytes = bytearray(leb128_u(len(runs)))
        for count, ltype in runs:
            loc_bytes.extend(leb128_u(count) + bytes([ltype]))
        tail = b""
        if not self.code or self.code[-1] != 0x0F:
            if self.ret_type == I32:
                tail = i32(0).code
            elif self.ret_type == F32:
                tail = f32(0.0).code
        body = bytes(loc_bytes) + bytes(self.code) + tail + b"\x0B"
        return leb128_u(len(body)) + body

class WasmASTCompileError(SyntaxError):
    """Structured AST-to-WASM compilation exception carrying exact source coordinates."""
    def __init__(self, message: str, kernel_name: str, lineno: int | None = None, col_offset: int | None = None, src_text: str = ""):
        super().__init__(message)
        self.message = message
        self.kernel_name = kernel_name
        self.lineno = lineno
        self.col_offset = col_offset
        self.src_text = src_text


def analyze_ast_with_beniget(tree: ast.Module, fn_name: str, start_line_offset: int = 0) -> dict:
    """Static Def-Use and Use-Def analysis powered by `gast` and `beniget`."""
    if not HAS_BENIGET:
        return {"enabled": False}
    try:
        gmod = gast.ast_to_gast(tree)
        duc = beniget.DefUseChains()
        duc.visit(gmod)
        udc = beniget.UseDefChains(duc)

        gfn = gmod.body[0]
        defs_summary = []
        dead_locals = []
        param_names = {arg.id for arg in gfn.args.args}
        seen_symbols = {}

        for node, d in duc.chains.items():
            if node is gfn:
                continue
            name = getattr(node, "id", getattr(node, "name", None))
            if not name or name == fn_name:
                continue
            use_count = len(d.users())
            line_no = getattr(node, "lineno", 1) + start_line_offset
            if name not in seen_symbols:
                seen_symbols[name] = {
                    "symbol": name,
                    "uses": use_count,
                    "is_param": name in param_names,
                    "line": line_no,
                }
            else:
                seen_symbols[name]["uses"] += use_count

        for name, info in seen_symbols.items():
            defs_summary.append(info)
            if info["uses"] == 0 and not info["is_param"]:
                dead_locals.append(name)
                log_compiler_event(
                    "WARN",
                    "BENIGET",
                    f"Kernel '{fn_name}': Local variable '{name}' is assigned at L{info['line']} but never read (dead store).",
                    line=info["line"],
                )

        loop_invariant_uses = []
        for child in gast.walk(gfn):
            if isinstance(child, (gast.For, gast.While)):
                loop_nodes = set(gast.walk(child))
                for ln in loop_nodes:
                    if isinstance(ln, gast.Name) and isinstance(ln.ctx, gast.Load):
                        defs_of_use = udc.chains.get(ln, [])
                        if defs_of_use and all(df.node not in loop_nodes for df in defs_of_use):
                            if ln.id not in loop_invariant_uses and ln.id not in ("range", "min", "max", "abs", "splat", "byte_offset", "sqrt"):
                                loop_invariant_uses.append(ln.id)

        log_compiler_event(
            "INFO",
            "BENIGET",
            f"Kernel '{fn_name}': Analyzed {len(defs_summary)} symbols ({len(dead_locals)} dead locals, {len(loop_invariant_uses)} loop-invariant symbols).",
            line=getattr(gfn, "lineno", 1) + start_line_offset,
        )

        return {
            "enabled": True,
            "defs": defs_summary,
            "dead_locals": dead_locals,
            "loop_invariants": loop_invariant_uses,
        }
    except Exception as exc:
        log_compiler_event("WARN", "BENIGET", f"Beniget analysis warning: {exc}")
        return {"enabled": False, "error": str(exc)}


def _ast_to_sympy_poly(node: ast.AST, sym_map: dict, vtypes: set):
    if isinstance(node, ast.Constant) and isinstance(node.value, (int, float)) and not isinstance(node.value, bool):
        if isinstance(node.value, float):
            vtypes.add(F32)
            return sympy.Float(node.value)
        vtypes.add(I32)
        return sympy.Integer(node.value)
    if isinstance(node, ast.Name) and node.id in sym_map:
        sym, vt = sym_map[node.id]
        if vt == V128:
            return None
        vtypes.add(vt)
        return sym
    if isinstance(node, ast.UnaryOp) and isinstance(node.op, ast.USub):
        inner = _ast_to_sympy_poly(node.operand, sym_map, vtypes)
        return -inner if inner is not None else None
    if isinstance(node, ast.BinOp) and isinstance(node.op, (ast.Add, ast.Sub, ast.Mult)):
        l_sym = _ast_to_sympy_poly(node.left, sym_map, vtypes)
        r_sym = _ast_to_sympy_poly(node.right, sym_map, vtypes)
        if l_sym is None or r_sym is None:
            return None
        if isinstance(node.op, ast.Add):
            return l_sym + r_sym
        if isinstance(node.op, ast.Sub):
            return l_sym - r_sym
        if isinstance(node.op, ast.Mult):
            return l_sym * r_sym
    return None


def _sympy_to_ast(expr, is_float: bool) -> ast.AST:
    if expr.is_Symbol:
        return ast.Name(id=str(expr), ctx=ast.Load())
    if expr.is_Number:
        val = float(expr) if is_float else int(expr)
        if val < 0:
            return ast.UnaryOp(op=ast.USub(), operand=ast.Constant(value=-val))
        return ast.Constant(value=val)
    if expr.is_Add:
        args = list(expr.args)
        cur = _sympy_to_ast(args[0], is_float)
        for a in args[1:]:
            if a.is_Mul and a.args[0].is_Number and float(a.args[0]) < 0:
                pos_mul = -a
                cur = ast.BinOp(left=cur, op=ast.Sub(), right=_sympy_to_ast(pos_mul, is_float))
            else:
                cur = ast.BinOp(left=cur, op=ast.Add(), right=_sympy_to_ast(a, is_float))
        return cur
    if expr.is_Mul:
        args = list(expr.args)
        if args[0] == -1:
            rest = sympy.Mul(*args[1:]) if len(args) > 2 else args[1]
            return ast.UnaryOp(op=ast.USub(), operand=_sympy_to_ast(rest, is_float))
        cur = _sympy_to_ast(args[0], is_float)
        for a in args[1:]:
            cur = ast.BinOp(left=cur, op=ast.Mult(), right=_sympy_to_ast(a, is_float))
        return cur
    if expr.is_Pow and expr.args[1].is_Integer and 1 <= int(expr.args[1]) <= 4:
        base_ast = _sympy_to_ast(expr.args[0], is_float)
        exp_n = int(expr.args[1])
        cur = base_ast
        for _ in range(exp_n - 1):
            cur = ast.BinOp(left=cur, op=ast.Mult(), right=base_ast)
        return cur
    raise ValueError("Unsupported SymPy node for AST lowering")


class _ASTKernelCompiler(ast.NodeVisitor):
    def __init__(self, fn: FuncBuilder, env: dict, atok=None, start_line_offset: int = 0):
        self.fn = fn
        self.env = env
        self.atok = atok
        self.start_line_offset = start_line_offset
        self.loop_stack: list[tuple[ControlLabel, ControlLabel]] = []

    def _track_node(self, node: ast.AST):
        lineno = getattr(node, "lineno", None)
        col = getattr(node, "col_offset", None)
        if lineno is not None:
            self.fn._current_line = lineno + self.start_line_offset
        if col is not None:
            self.fn._current_col = col
        if self.atok is not None and lineno is not None:
            try:
                txt = self.atok.get_text(node).strip().splitlines()[0]
                self.fn._current_src = txt[:56]
            except Exception:
                pass

    def visit(self, node: ast.AST):
        self._track_node(node)
        try:
            return super().visit(node)
        except WasmASTCompileError:
            raise
        except Exception as exc:
            raise WasmASTCompileError(
                message=f"{type(exc).__name__}: {exc}",
                kernel_name=self.fn.name,
                lineno=self.fn._current_line,
                col_offset=self.fn._current_col,
                src_text=self.fn._current_src,
            ) from exc

    def _try_sympy_rewrite(self, node: ast.BinOp) -> ast.AST:
        if not HAS_SYMPY or not isinstance(node.op, (ast.Add, ast.Sub, ast.Mult)):
            return node
        sym_map = {
            name: (sympy.Symbol(name, real=True), var.vtype)
            for name, var in self.fn.named_vars.items()
            if var.vtype in (I32, F32) and not var.is_byte_offset
        }
        vtypes = set()
        sym_expr = _ast_to_sympy_poly(node, sym_map, vtypes)
        if sym_expr is None or len(vtypes) != 1:
            return node
        try:
            orig_ops = int(sympy.count_ops(sym_expr))
            if orig_ops < 2:
                return node
            simplified = sympy.simplify(sym_expr)
            if len(simplified.free_symbols) == 1:
                simplified = sympy.horner(simplified)
            new_ops = int(sympy.count_ops(simplified))
            if new_ops < orig_ops or str(simplified) != str(sym_expr):
                is_float = (F32 in vtypes)
                rewritten_ast = _sympy_to_ast(simplified, is_float=is_float)
                orig_str = ast.unparse(node) if hasattr(ast, "unparse") else str(sym_expr)
                new_str = ast.unparse(rewritten_ast) if hasattr(ast, "unparse") else str(simplified)
                if orig_str != new_str:
                    ops_saved = max(0, orig_ops - new_ops)
                    self.fn.sympy_rewrites.append({
                        "line": self.fn._current_line,
                        "original": orig_str,
                        "simplified": new_str,
                        "ops_saved": ops_saved,
                    })
                    log_compiler_event(
                        "OPT",
                        "SYMPY",
                        f"Kernel '{self.fn.name}' L{self.fn._current_line}: Rewrote `{orig_str}` -> `{new_str}`",
                        line=self.fn._current_line,
                    )
                return rewritten_ast
        except Exception:
            pass
        return node

    def eval_expr(self, node: ast.AST, allow_sympy: bool = True):
        self._track_node(node)
        if isinstance(node, ast.Constant):
            if isinstance(node.value, bool):
                return i32(int(node.value))
            if isinstance(node.value, int):
                return i32(node.value)
            if isinstance(node.value, float):
                return f32(node.value)
            raise SyntaxError(f"Unsupported constant literal {node.value!r} (only int, float, bool are allowed in WASM kernels)")

        if isinstance(node, ast.Name):
            if node.id in self.fn.named_vars:
                return self.fn.named_vars[node.id]
            if node.id in self.env:
                val = self.env[node.id]
                if isinstance(val, int) and not isinstance(val, bool):
                    return i32(val)
                if isinstance(val, float):
                    return f32(val)
                return val
            known = list(self.fn.named_vars.keys())
            raise NameError(f"Unknown variable or symbol '{node.id}' in WASM kernel '{self.fn.name}'. Locals in scope: {known}")

        if isinstance(node, ast.UnaryOp):
            operand = self.eval_expr(node.operand, allow_sympy=allow_sympy)
            if isinstance(node.op, ast.USub):
                return -operand
            if isinstance(node.op, ast.Not):
                return operand.eqz() if isinstance(operand, Expr) else (not operand)
            if isinstance(node.op, ast.Invert):
                return ~operand

        if isinstance(node, ast.BinOp):
            if allow_sympy:
                rewritten = self._try_sympy_rewrite(node)
                if rewritten is not node:
                    return self.eval_expr(rewritten, allow_sympy=False)
            left = self.eval_expr(node.left, allow_sympy=False)
            right = self.eval_expr(node.right, allow_sympy=False)
            op_map = {
                ast.Add: lambda a, b: a + b,
                ast.Sub: lambda a, b: a - b,
                ast.Mult: lambda a, b: a * b,
                ast.Div: lambda a, b: a / b,
                ast.Mod: lambda a, b: a % b,
                ast.BitAnd: lambda a, b: a & b,
                ast.BitOr: lambda a, b: a | b,
                ast.BitXor: lambda a, b: a ^ b,
                ast.LShift: lambda a, b: a << b,
                ast.RShift: lambda a, b: a >> b,
            }
            for op_cls, fn_op in op_map.items():
                if isinstance(node.op, op_cls):
                    return fn_op(left, right)

        if isinstance(node, ast.BoolOp):
            vals = [self.eval_expr(v) for v in node.values]
            res = vals[0]
            for v in vals[1:]:
                res = (res & v) if isinstance(node.op, ast.And) else (res | v)
            return res

        if isinstance(node, ast.Compare):
            left = self.eval_expr(node.left)
            res = None
            cur = left
            for op, comp in zip(node.ops, node.comparators):
                rhs = self.eval_expr(comp)
                if isinstance(op, ast.Lt): c = cur < rhs
                elif isinstance(op, ast.LtE): c = cur <= rhs
                elif isinstance(op, ast.Gt): c = cur > rhs
                elif isinstance(op, ast.GtE): c = cur >= rhs
                elif isinstance(op, ast.Eq): c = cur.eq(rhs)
                elif isinstance(op, ast.NotEq): c = cur.ne(rhs)
                else: raise SyntaxError(f"Unsupported comparison operator: {type(op).__name__}")
                res = c if res is None else (res & c)
                cur = rhs
            return res

        if isinstance(node, ast.IfExp):
            cond = self.eval_expr(node.test)
            t_val = self.eval_expr(node.body)
            f_val = self.eval_expr(node.orelse)
            return select(cond, t_val, f_val)

        if isinstance(node, ast.Subscript):
            target = self.eval_expr(node.value)
            idx = self.eval_expr(node.slice)
            return target[idx]

        if isinstance(node, ast.Attribute):
            obj = self.eval_expr(node.value)
            return getattr(obj, node.attr)

        if isinstance(node, ast.Call):
            func = self.eval_expr(node.func)
            args = [self.eval_expr(a) for a in node.args]
            if func is min and len(args) == 2: return args[0].min(args[1])
            if func is max and len(args) == 2: return args[0].max(args[1])
            if func is abs and len(args) == 1: return args[0].abs()
            return func(*args)

        raise SyntaxError(f"Unsupported Python AST node '{type(node).__name__}' in WASM kernel: {ast.dump(node)}")

    def _try_static_bool(self, test_node: ast.AST) -> bool | None:
        if isinstance(test_node, ast.Name) and test_node.id not in self.fn.named_vars and test_node.id in self.env:
            val = self.env[test_node.id]
            if isinstance(val, bool):
                return val
        if isinstance(test_node, ast.UnaryOp) and isinstance(test_node.op, ast.Not):
            inner = self._try_static_bool(test_node.operand)
            if inner is not None:
                return not inner
        return None

    def visit_Assign(self, node: ast.Assign):
        if len(node.targets) != 1:
            raise SyntaxError("Multiple assignment targets not supported in WASM kernel.")
        target = node.targets[0]
        val = self.eval_expr(node.value)

        if isinstance(target, ast.Name):
            if target.id in self.fn.named_vars:
                self.fn.named_vars[target.id].set(val)
            else:
                vtype_name = {I32: "i32", F32: "f32", V128: "v128"}[val.vtype]
                if getattr(val, "is_byte_offset", False):
                    vtype_name = "byte_offset"
                self.fn.local(target.id, vtype_name, init=val)
        elif isinstance(target, ast.Subscript):
            arr = self.eval_expr(target.value)
            idx = self.eval_expr(target.slice)
            arr[idx] = val
        elif isinstance(target, ast.Attribute):
            obj = self.eval_expr(target.value)
            setattr(obj, target.attr, val)
        else:
            raise SyntaxError(f"Unsupported assignment target: {ast.dump(target)}")

    def visit_AnnAssign(self, node: ast.AnnAssign):
        if not isinstance(node.target, ast.Name) or not isinstance(node.annotation, ast.Name):
            raise SyntaxError("Annotated local must be `name: type = val` (e.g. `x: f32 = 0.0`)")
        dtype = node.annotation.id
        init_val = self.eval_expr(node.value) if node.value is not None else None
        self.fn.local(node.target.id, dtype, init=init_val)

    def visit_AugAssign(self, node: ast.AugAssign):
        bin_node = ast.BinOp(
            left=node.target,
            op=node.op,
            right=node.value,
            lineno=getattr(node, "lineno", 1),
            col_offset=getattr(node, "col_offset", 0),
        )
        assign_node = ast.Assign(
            targets=[node.target],
            value=bin_node,
            lineno=getattr(node, "lineno", 1),
            col_offset=getattr(node, "col_offset", 0),
        )
        self.visit_Assign(assign_node)

    def visit_If(self, node: ast.If):
        static_eval = self._try_static_bool(node.test)
        if static_eval is True:
            for stmt in node.body:
                self.visit(stmt)
            return
        if static_eval is False:
            for stmt in node.orelse:
                self.visit(stmt)
            return

        cond = self.eval_expr(node.test)
        with self.fn.if_(cond):
            for stmt in node.body:
                self.visit(stmt)
            if node.orelse:
                self.fn.else_()
                for stmt in node.orelse:
                    self.visit(stmt)

    def visit_While(self, node: ast.While):
        is_while_true = isinstance(node.test, ast.Constant) and node.test.value in (True, 1)
        with self.fn.block() as brk, self.fn.loop() as cont:
            if not is_while_true:
                cond = self.eval_expr(node.test)
                self.fn.br_if(cond.eqz(), brk)
            self.loop_stack.append((brk, cont))
            try:
                for stmt in node.body:
                    self.visit(stmt)
            finally:
                self.loop_stack.pop()
            self.fn.br(cont)

    def visit_For(self, node: ast.For):
        if not (isinstance(node.iter, ast.Call) and isinstance(node.iter.func, ast.Name) and node.iter.func.id == "range"):
            raise SyntaxError("Only `for i in range(...)` loops are supported in WASM kernels.")
        args = [self.eval_expr(a) for a in node.iter.args]
        step_const = 1
        if len(args) == 1:
            start_e, stop_e, step_e = i32(0), args[0], i32(1)
        elif len(args) == 2:
            start_e, stop_e, step_e = args[0], args[1], i32(1)
        elif len(args) == 3:
            start_e, stop_e, step_e = args[0], args[1], args[2]
            if isinstance(node.iter.args[2], ast.UnaryOp) and isinstance(node.iter.args[2].op, ast.USub):
                step_const = -1
        else:
            raise SyntaxError("Invalid `range()` arguments.")

        loop_var = self.fn.local(node.target.id, "i32", init=start_e)
        with self.fn.block() as brk, self.fn.loop() as top:
            cond = (loop_var < stop_e) if step_const > 0 else (loop_var > stop_e)
            self.fn.br_if(cond.eqz(), brk)
            with self.fn.block() as cont:
                self.loop_stack.append((brk, cont))
                try:
                    for stmt in node.body:
                        self.visit(stmt)
                finally:
                    self.loop_stack.pop()
            loop_var.set(loop_var + step_e)
            self.fn.br(top)

    def visit_Break(self, node: ast.Break):
        if not self.loop_stack:
            raise SyntaxError("`break` outside of loop in WASM kernel.")
        brk, _ = self.loop_stack[-1]
        self.fn.br(brk)

    def visit_Continue(self, node: ast.Continue):
        if not self.loop_stack:
            raise SyntaxError("`continue` outside of loop in WASM kernel.")
        _, cont = self.loop_stack[-1]
        self.fn.br(cont)

    def visit_Return(self, node: ast.Return):
        val = self.eval_expr(node.value) if node.value is not None else None
        self.fn.ret(val)

    def visit_Expr(self, node: ast.Expr):
        if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
            return
        res = self.eval_expr(node.value)
        if isinstance(res, Expr):
            self.fn._emit(res.code)
# endregion


# region 6 wasm_module_and_runtime_instantiation
class WasmModule:
    def __init__(self, align_bytes: int = 16):
        self.align_bytes = align_bytes
        self.next_offset = 0
        self.arrays: dict[str, MemoryArray] = {}
        self.struct_outs: dict[str, StructOut] = {}
        self.functions: list[FuncBuilder] = []
        self.section_sizes: dict[str, int] = {}
        self._last_runtime: dict | None = None

    def array(self, name: str, dtype: str, capacity: int, offset: int | None = None) -> MemoryArray:
        if offset is None:
            rem = self.next_offset % self.align_bytes
            if rem:
                self.next_offset += self.align_bytes - rem
            offset = self.next_offset
        arr = MemoryArray(self, name, dtype, capacity, offset)
        self.arrays[name] = arr
        self.next_offset = max(self.next_offset, offset + arr.byte_length)
        return arr

    def struct_out(self, name: str, fields: list[str], dtype: str = "f32", offset: int | None = None) -> StructOut:
        arr = self.array(name, dtype, max(16, len(fields)), offset=offset)
        so = StructOut(arr, fields)
        self.struct_outs[name] = so
        return so

    def function(self, name: str, ret_type: str | None = "i32") -> FuncBuilder:
        fn = FuncBuilder(name, ret_type)
        self.functions.append(fn)
        return fn

    def kernel(self, ret: str | None = "i32", **param_types):
        def decorator(py_fn):
            sig = inspect.signature(py_fn)
            ret_t = ret
            if sig.return_annotation is not inspect.Parameter.empty:
                ann = sig.return_annotation
                ret_t = ann if isinstance(ann, str) else getattr(ann, "__name__", ret)

            fn = self.function(py_fn.__name__, ret_type=ret_t)
            fn.py_fn = py_fn
            for p_name, p_obj in sig.parameters.items():
                if p_name in param_types:
                    p_type = param_types[p_name]
                elif p_obj.annotation is not inspect.Parameter.empty:
                    ann = p_obj.annotation
                    p_type = ann if isinstance(ann, str) else getattr(ann, "__name__", "i32")
                else:
                    p_type = "i32"
                fn.param(p_name, p_type)

            env = dict(py_fn.__globals__)
            if py_fn.__closure__:
                for cell_name, cell in zip(py_fn.__code__.co_freevars, py_fn.__closure__):
                    env[cell_name] = cell.cell_contents
            env.update({
                "i32": i32, "f32": f32, "byte_offset": byte_offset,
                "select": select, "murmur_hash32": murmur_hash32,
                "min": min, "max": max, "abs": abs,
                "splat": lambda x: (x if isinstance(x, Expr) else f32(x)).splat(),
                "any_true": lambda v: v.any_true(),
                "all_true": lambda v: v.all_true(),
                "sqrt": lambda x: x.sqrt(),
                "clamp": lambda x, lo, hi: x.clamp(lo, hi),
                "shr_u": lambda x, b: x.shr_u(b),
                "lt_u": lambda a, b: a.lt_u(b),
                "ge_u": lambda a, b: a.ge_u(b),
            })

            lines, start_line = inspect.getsourcelines(py_fn)
            src = textwrap.dedent("".join(lines))
            tree = ast.parse(src)
            atok = asttokens.ASTTokens(src, tree=tree) if HAS_ASTTOKENS else None
            fn_def = tree.body[0]

            fn.beniget_report = analyze_ast_with_beniget(tree, fn.name, start_line_offset=start_line - 1)

            with fn:
                compiler = _ASTKernelCompiler(fn, env, atok=atok, start_line_offset=start_line - 1)
                for stmt in fn_def.body:
                    compiler.visit(stmt)

            log_compiler_event(
                "PASS",
                "AST",
                f"Compiled @kernel '{fn.name}' -> {len(fn.code)} bytes of bytecode ({len(fn.locals)} locals).",
                line=start_line,
            )
            return fn

        return decorator

    def to_bytes(self, min_pages: int | None = None) -> bytes:
        req_pages = (self.next_offset + 65535) // 65536
        pages = max(req_pages, min_pages or 1)

        type_sec = encode_section(
            1, leb128_u(len(self.functions)) + b"".join(f.encode_signature() for f in self.functions)
        )
        func_sec = encode_section(
            3, leb128_u(len(self.functions)) + b"".join(leb128_u(i) for i in range(len(self.functions)))
        )
        mem_sec = encode_section(5, leb128_u(1) + b"\x00" + leb128_u(pages))

        def _exp(name: str, kind: int, idx: int) -> bytes:
            nb = name.encode("ascii")
            return leb128_u(len(nb)) + nb + bytes([kind]) + leb128_u(idx)

        exps = [_exp("mem", 2, 0)] + [_exp(f.name, 0, i) for i, f in enumerate(self.functions)]
        exp_sec = encode_section(7, leb128_u(len(exps)) + b"".join(exps))

        code_sec = encode_section(
            10, leb128_u(len(self.functions)) + b"".join(f.encode_body() for f in self.functions)
        )
        self.section_sizes = {
            "Header": 8,
            "Type (0x01)": len(type_sec),
            "Func (0x03)": len(func_sec),
            "Memory (0x05)": len(mem_sec),
            "Export (0x07)": len(exp_sec),
            "Code (0x0A)": len(code_sec),
            "Pages (64KB)": pages,
        }
        total_bytes = b"\x00asm\x01\x00\x00\x00" + type_sec + func_sec + mem_sec + exp_sec + code_sec
        log_compiler_event(
            "INFO",
            "EMIT",
            f"Emitted WASM binary ({len(total_bytes)}B total: Code={len(code_sec)}B, Exports={len(exp_sec)}B, Memory={pages} page(s)).",
        )
        return total_bytes

    def instantiate(self, min_pages: int | None = None, custom_wasm_bytes: bytes | None = None) -> dict:
        wasm_bytes = custom_wasm_bytes or self.to_bytes(min_pages=min_pages)

        if HAS_JS:
            u8 = js.Uint8Array.new(len(wasm_bytes))
            u8.assign(memoryview(wasm_bytes))
            mod = js.WebAssembly.Module.new(u8)
            inst = js.WebAssembly.Instance.new(mod)
            ex = inst.exports
            buf = ex.mem.buffer

            result = {"wasm_bytes": wasm_bytes, "exports": ex, "module_obj": self}
            for f in self.functions:
                result[f.name] = getattr(ex, f.name)
            for name, arr in self.arrays.items():
                cls = js.Float32Array if arr.dtype == "f32" else js.Int32Array
                result[name] = cls.new(buf, arr.byte_offset, arr.capacity)
            for name, so in self.struct_outs.items():
                so._bind_runtime(result[name])
                result[f"{name}_struct"] = so
            self._last_runtime = result
            return result

        import ctypes
        import wasmtime
        store = wasmtime.Store()
        module = wasmtime.Module(store.engine, wasm_bytes)
        instance = wasmtime.Instance(store, module, [])
        exports = instance.exports(store)
        mem = exports["mem"]
        base_ptr = ctypes.addressof(mem.data_ptr(store).contents)

        result = {"wasm_bytes": wasm_bytes, "store": store, "module_obj": self}
        for f in self.functions:
            fn_export = exports[f.name]
            result[f.name] = lambda *args, _fn=fn_export: _fn(store, *args)
        for name, arr in self.arrays.items():
            c_type = ctypes.c_float if arr.dtype == "f32" else ctypes.c_int32
            c_arr = (c_type * arr.capacity).from_address(base_ptr + arr.byte_offset)
            result[name] = memoryview(c_arr)
        for name, so in self.struct_outs.items():
            so._bind_runtime(result[name])
            result[f"{name}_struct"] = so
        self._last_runtime = result
        return result


def compile_with_simd_fallback(builder_fn, min_pages: int | None = None) -> dict | None:
    last_exc = None
    for use_simd in (True, False):
        try:
            mod = builder_fn(use_simd=use_simd)
            inst = mod.instantiate(min_pages=min_pages)
            inst["simd"] = use_simd
            inst["module_obj"] = mod
            return inst
        except WasmASTCompileError:
            raise
        except Exception as exc:
            last_exc = exc
            log_compiler_event("WARN", "EMIT", f"SIMD={use_simd} instantiation failed ({exc}), trying fallback...")
            continue
    if last_exc is not None:
        raise last_exc
    return None

# region 7 c_buffer_soa_arena_with_numpy_vectorization
class SoAArena:
    def __init__(
        self,
        schema: dict[str, str],
        max_capacity: int = 262144,
        wasm_runtime: dict | None = None,
        spatial_chunk_fields: tuple[str, str, str, str, str] | None = None,
    ):
        self.schema = schema
        self.max_capacity = max_capacity
        self.capacity = max_capacity
        self.cursor = 0
        self.reclaimable = 0
        self.wasm = wasm_runtime
        self.spatial_chunk_fields = spatial_chunk_fields

        self.fields: dict[str, array] = {
            name: array("f" if dtype == "f32" else "i", [0]) * max_capacity
            for name, dtype in schema.items()
        }
        self.np_fields: dict[str, "np.ndarray"] = {}
        if HAS_NUMPY:
            self._rebind_numpy_views()

        if spatial_chunk_fields:
            n_chunks = (max_capacity >> 2) + 4
            self.chunkMinX = array("f", [0.0]) * n_chunks
            self.chunkMaxX = array("f", [0.0]) * n_chunks
            self.chunkMinY = array("f", [0.0]) * n_chunks
            self.chunkMaxY = array("f", [0.0]) * n_chunks
            self.chunkMaxBm = array("f", [0.0]) * n_chunks

    def _rebind_numpy_views(self):
        if not HAS_NUMPY:
            return
        for name, arr in self.fields.items():
            dt = np.float32 if self.schema[name] == "f32" else np.int32
            self.np_fields[name] = np.frombuffer(arr, dtype=dt)

    def __getitem__(self, field_name: str) -> array:
        return self.fields[field_name]

    def as_numpy(self, field_name: str):
        if HAS_NUMPY:
            return self.np_fields[field_name][:self.cursor]
        raise RuntimeError("NumPy is not loaded")

    def clear(self):
        self.cursor = 0
        self.reclaimable = 0

    def alloc(self, count: int) -> int:
        if self.cursor + count > self.capacity:
            self._grow(max(self.capacity * 2, self.cursor + count + 4096))
        start = self.cursor
        self.cursor += count
        return start

    def free(self, start: int, count: int):
        if count <= 0:
            return
        if start + count == self.cursor:
            self.cursor = start
        else:
            self.reclaimable += count

    def sync_range_to_wasm(self, start: int, count: int, field_names: list[str] | None = None):
        if count <= 0:
            return
        end = start + count

        if self.spatial_chunk_fields:
            if HAS_NUMPY:
                k_x1, k_y1, k_x2, k_y2, k_bm = self.spatial_chunk_fields
                c_start = start >> 2
                c_end = ((min(end, self.cursor) - 1) >> 2) + 1
                i0 = c_start << 2
                i1 = min(self.cursor, c_end << 2)
                if i0 < i1:
                    indices = np.arange(0, i1 - i0, 4, dtype=np.intp)
                    x1 = self.np_fields[k_x1][i0:i1]
                    y1 = self.np_fields[k_y1][i0:i1]
                    x2 = self.np_fields[k_x2][i0:i1]
                    y2 = self.np_fields[k_y2][i0:i1]
                    bm = self.np_fields[k_bm][i0:i1]

                    np.frombuffer(self.chunkMinX, dtype=np.float32)[c_start:c_start + len(indices)] = np.minimum.reduceat(np.minimum(x1, x2), indices)
                    np.frombuffer(self.chunkMaxX, dtype=np.float32)[c_start:c_start + len(indices)] = np.maximum.reduceat(np.maximum(x1, x2), indices)
                    np.frombuffer(self.chunkMinY, dtype=np.float32)[c_start:c_start + len(indices)] = np.minimum.reduceat(np.minimum(y1, y2), indices)
                    np.frombuffer(self.chunkMaxY, dtype=np.float32)[c_start:c_start + len(indices)] = np.maximum.reduceat(np.maximum(y1, y2), indices)
                    np.frombuffer(self.chunkMaxBm, dtype=np.float32)[c_start:c_start + len(indices)] = np.maximum.reduceat(bm, indices)
            else:
                f_x1, f_y1, f_x2, f_y2, f_bm = (self.fields[k] for k in self.spatial_chunk_fields)
                c_min_x, c_max_x = self.chunkMinX, self.chunkMaxX
                c_min_y, c_max_y = self.chunkMinY, self.chunkMaxY
                c_max_bm = self.chunkMaxBm
                limit = self.cursor
                for c in range(start >> 2, ((end - 1) >> 2) + 1):
                    i0 = c << 2
                    i1 = min(limit, i0 + 4)
                    if i0 >= i1:
                        break
                    mn_x = mx_x = f_x1[i0]
                    mn_y = mx_y = f_y1[i0]
                    mbm = 0.0
                    for k in range(i0, i1):
                        x1, y1, x2, y2, m = f_x1[k], f_y1[k], f_x2[k], f_y2[k], f_bm[k]
                        if x1 < mn_x: mn_x = x1
                        if x2 < mn_x: mn_x = x2
                        if x1 > mx_x: mx_x = x1
                        if x2 > mx_x: mx_x = x2
                        if y1 < mn_y: mn_y = y1
                        if y2 < mn_y: mn_y = y2
                        if y1 > mx_y: mx_y = y1
                        if y2 > mx_y: mx_y = y2
                        if m > mbm: mbm = m
                    c_min_x[c], c_max_x[c] = mn_x, mx_x
                    c_min_y[c], c_max_y[c] = mn_y, mx_y
                    c_max_bm[c] = mbm

        w = self.wasm
        if w is None or end > self.max_capacity:
            return
        for name in (field_names or self.schema.keys()):
            if name not in w:
                continue
            py_mv = memoryview(self.fields[name])[start:end]
            w_arr = w[name]
            if HAS_JS:
                w_arr.subarray(start, end).assign(py_mv)
            else:
                w_arr[start:end] = py_mv

    def fill_wasm_field(self, field_name: str, start: int, count: int, value: float | int):
        w = self.wasm
        end = start + count
        if w is not None and count > 0 and end <= self.max_capacity:
            if HAS_JS:
                w[field_name].fill(value, start, end)
            else:
                tc = "f" if self.schema[field_name] == "f32" else "i"
                w[field_name][start:end] = memoryview(array(tc, [value]) * count)

    def should_compact(self, min_reclaim: int = 4096) -> bool:
        return self.reclaimable > min_reclaim and self.reclaimable > (self.cursor >> 1)

    def compact(self, owners, start_attr: str = "seg_start", count_attr: str = "seg_count"):
        write = 0
        for obj in owners:
            count = getattr(obj, count_attr)
            if not count:
                continue
            read = getattr(obj, start_attr)
            if read != write:
                end = read + count
                for arr in self.fields.values():
                    arr[write:write + count] = arr[read:end]
                setattr(obj, start_attr, write)
            write += count
        self.cursor = write
        self.reclaimable = 0
        if write > 0:
            self.sync_range_to_wasm(0, write)

    def _grow(self, new_cap: int):
        extra = new_cap - self.capacity
        self.capacity = new_cap
        for name, dtype in self.schema.items():
            tc = "f" if dtype == "f32" else "i"
            self.fields[name].extend(array(tc, [0]) * extra)
        if HAS_NUMPY:
            self._rebind_numpy_views()
        if self.spatial_chunk_fields:
            n_chunks = ((new_cap >> 2) + 4) - len(self.chunkMinX)
            if n_chunks > 0:
                ext = array("f", [0.0]) * n_chunks
                self.chunkMinX.extend(ext)
                self.chunkMaxX.extend(ext)
                self.chunkMinY.extend(ext)
                self.chunkMaxY.extend(ext)
                self.chunkMaxBm.extend(ext)
        if new_cap > self.max_capacity:
            self.wasm = None
# endregion

    0x11: "i32x4.splat", 0x13: "f32x4.splat",
    0x41: "f32x4.eq", 0x42: "f32x4.ne", 0x43: "f32x4.lt", 0x44: "f32x4.gt", 0x45: "f32x4.le", 0x46: "f32x4.ge",
    0x4D: "v128.not", 0x4E: "v128.and", 0x50: "v128.or", 0x51: "v128.xor", 0x53: "v128.any_true",
    0x66: "f32x4.ceil", 0x67: "f32x4.floor",
    0xA3: "i32x4.all_true",
    0xE0: "f32x4.abs", 0xE1: "f32x4.neg", 0xE3: "f32x4.sqrt",
    0xE4: "f32x4.add", 0xE5: "f32x4.sub", 0xE6: "f32x4.mul", 0xE7: "f32x4.div",
    0xEC: "f32x4.min", 0xED: "f32x4.max",
}


def _read_leb128_u(buf: bytes, pos: int) -> tuple[int, int]:
    res, shift = 0, 0
    while pos < len(buf):
        b = buf[pos]
        pos += 1
        res |= (b & 0x7F) << shift
        if (b & 0x80) == 0:
            break
        shift += 7
    return res, pos


def _read_leb128_s(buf: bytes, pos: int) -> tuple[int, int]:
    res, shift, b = 0, 0, 0
    while pos < len(buf):
        b = buf[pos]
        pos += 1
        res |= (b & 0x7F) << shift
        shift += 7
        if (b & 0x80) == 0:
            break
    if (shift < 32) and (b & 0x40):
        res |= -(1 << shift)
    return res, pos


def _lookup_line(offset: int, line_spans: list[tuple[int, int, int, str]] | None):
    if not line_spans:
        return None, ""
    for s_off, e_off, lineno, src in line_spans:
        if s_off <= offset < e_off:
            return lineno, src
    return None, ""


def disassemble_code(code: bytes, line_spans: list[tuple[int, int, int, str]] | None = None) -> list[dict]:
    lines = []
    pos = 0
    indent = 0
    while pos < len(code):
        start_pos = pos
        op = code[pos]
        pos += 1
        if op in (0x02, 0x03, 0x04):
            pos += 1
            text = f"{'  '*indent}{OPCODE_NAMES[op]} (void)"
            indent += 1
        elif op == 0x05:
            text = f"{'  '*max(0,indent-1)}else"
        elif op == 0x0B:
            indent = max(0, indent - 1)
            text = f"{'  '*indent}end"
        elif op in (0x0C, 0x0D, 0x20, 0x21, 0x22):
            val, pos = _read_leb128_u(code, pos)
            text = f"{'  '*indent}{OPCODE_NAMES[op]} {val}"
        elif op in (0x28, 0x2A, 0x36, 0x38):
            align, pos = _read_leb128_u(code, pos)
            offset, pos = _read_leb128_u(code, pos)
            text = f"{'  '*indent}{OPCODE_NAMES[op]} offset={offset} align={1<<align}"
        elif op == 0x41:
            val, pos = _read_leb128_s(code, pos)
            text = f"{'  '*indent}i32.const {val}"
        elif op == 0x43:
            fval = struct.unpack("<f", code[pos:pos+4])[0]
            pos += 4
            text = f"{'  '*indent}f32.const {fval:.4g}"
        elif op == 0xFD:
            sub, pos = _read_leb128_u(code, pos)
            sub_name = SIMD_SUB_OPCODES.get(sub, f"v128.op_{hex(sub)}")
            if sub in (0x00, 0x0B):
                align, pos = _read_leb128_u(code, pos)
                offset, pos = _read_leb128_u(code, pos)
                text = f"{'  '*indent}{sub_name} offset={offset} align={1<<align}"
            else:
                text = f"{'  '*indent}{sub_name}"
        else:
            name = OPCODE_NAMES.get(op, f"op_{hex(op)}")
            text = f"{'  '*indent}{name}"

        py_line, py_src = _lookup_line(start_pos, line_spans)
        lines.append({
            "offset": start_pos,
            "byte_len": pos - start_pos,
            "hex": code[start_pos:pos].hex(" "),
            "text": text,
            "py_line": py_line,
            "py_src": py_src,
            "is_simd": (op == 0xFD),
        })
    return lines
